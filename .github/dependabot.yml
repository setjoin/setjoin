version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/clients"
      - "/clients/desktop/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directories:
      - "/webmail"
      - "/clients/desktop"
      - "/clients/desktop/electron"
      - "/clients/rust/desktop-native"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
