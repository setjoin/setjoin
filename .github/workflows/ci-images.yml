name: CI images

# Builds the server-rust lane images, mirrors the tag-referenced third-party images the tests
# use, pushes them to GHCR and prints the pinned digests for .github/ci/images.lock (commit them).
# The only workflow with packages: write (job-scoped). Same-repo pull requests run it too so the
# very first PR can bootstrap images.lock before any workflow exists on main; fork pull requests
# never push (their token is read-only and the job is skipped). images.lock itself is excluded
# from the path filters: every build yields new digests, so re-triggering on the lock would loop.
on:
  pull_request:
    paths: &paths
      - '.github/ci/**'
      - '!.github/ci/images.lock'
      - '.github/workflows/ci-images.yml'
      - 'scripts/server-rust-lane-tools.sh'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-images
  cancel-in-progress: false

jobs:
  images:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, push and pin
        shell: bash
        run: |
          set -euo pipefail
          reg="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          label="org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          lock="$RUNNER_TEMP/images.lock"
          : >"$lock"
          # push LOCAL REPO: push LOCAL as $reg/REPO:<sha>; print "LOCAL=<pinned digest reference>"
          push() {
            docker tag "$1" "$reg/$2:$GITHUB_SHA"
            docker push -q "$reg/$2:$GITHUB_SHA" >/dev/null
            echo "$1=$(docker inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$reg/$2:$GITHUB_SHA" | grep -m1 "^$reg/$2@")"
          }
          docker build -q --label "$label" -t setjoin-ci-linux-tc:local-amd64 -f .github/ci/linux-toolchain.Dockerfile .github/ci
          push setjoin-ci-linux-tc:local-amd64 setjoin-ci-linux-tc >>"$lock"
          base="$(sed -n 's/^setjoin-ci-linux-tc:local-amd64=//p' "$lock")"
          docker build -q --label "$label" --build-arg BASE="$base" -t setjoin-server-rust-lane -f .github/ci/server-rust-lane.Dockerfile .
          push setjoin-server-rust-lane setjoin-server-rust-lane >>"$lock"
          docker build -q --label "$label" -t setjoin-lane-pg:17 -f .github/ci/lane-pg.Dockerfile .github/ci
          push setjoin-lane-pg:17 setjoin-lane-pg >>"$lock"
          for image in alpine:3.24 postgres:17; do
            docker pull -q "$image" >/dev/null
            push "$image" "mirror-${image%%:*}" >>"$lock"
          done
          # digest-pinned Docker Hub references the tests run with --pull never: pulled as themselves
          for ref in 'kristophjunge/test-saml-idp@sha256:02a6e56c01f94b9ba3f2151f33acedf4606ac9b7eeb62a874c5a6b032c0fa9cc' \
                     'apache/james:demo-3.8.0@sha256:e7ac5b29e148b61adf8e9345c5ef011c85c39445b4223d5d75731250dd0a7fd2'; do
            echo "$ref=$ref" >>"$lock"
          done
          {
            echo '### .github/ci/images.lock (commit this file; make new GHCR packages public once)'
            echo '```'
            echo "# LOCAL NAME=PINNED REFERENCE; generated by ci-images run $GITHUB_RUN_ID from $GITHUB_SHA"
            cat "$lock"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
