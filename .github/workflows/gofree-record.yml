name: gofree record

# Records NEW Go-free oracle goldens from the frozen Go coverage binary (#339). Manual only:
# no pull_request or push trigger. It never commits: new goldens come back as an artifact.
# Deleted with Go (#142). Contract: server-rust/DOX.md#frozen-go-recording-workflow.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Cargo package of the oracle (for example setjoin-gateway)
        required: true
      test:
        description: Oracle integration test target (cargo --test)
        required: true
      case_filter:
        description: Optional libtest case filter (empty = every case; existing goldens are only compared)
        default: ''
      go_source:
        description: Must be empty or equal the dispatched ref's commit (dispatch with the frozen ref); recorded into the goldens
        default: ''
      go_upstream:
        description: none = gateway-style recorders (GOFREE_RECORD_GO_BINARY); authserverd = start the covered Go authserver and set GOFREE_RECORD_UPSTREAM (auth-listener oracles)
        type: choice
        options: [none, authserverd]
        default: none
      extra_env:
        description: Optional GOFREE_RECORD_*, GOFREE_ORACLE_* or GOFREE_VERIFY_* NAME=value lines (newline-separated)
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  group: gofree-record
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # bash -eo pipefail

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: '5'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  record:
    if: github.repository == 'setjoin/setjoin'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LANE_JOB_TAG: record
      GOFREE_REC_PACKAGE: ${{ inputs.package }}
      GOFREE_REC_TEST: ${{ inputs.test }}
      GOFREE_REC_FILTER: ${{ inputs.case_filter }}
      GOFREE_REC_EXTRA: ${{ inputs.extra_env }}
      GOFREE_REC_UPSTREAM: ${{ inputs.go_upstream }}
      GO_SOURCE_INPUT: ${{ inputs.go_source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$GOFREE_REC_EXTRA" != *LEARN*=* ]] || { echo "::error::learning mode (*_LEARN) cannot be requested"; exit 1; }
          # containers that exist before this job starts anything (the hosted VM is job-owned)
          docker ps -aq | sort > "$RUNNER_TEMP/containers-before.txt"
          [[ "$GOFREE_REC_PACKAGE$GOFREE_REC_TEST" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::package and test must be [A-Za-z0-9_-]"; exit 1; }
          [[ -z "$GOFREE_REC_FILTER" || "$GOFREE_REC_FILTER" =~ ^[A-Za-z0-9_][A-Za-z0-9_:.-]*$ ]] || { echo "::error::bad case_filter"; exit 1; }
          [[ -z "$GO_SOURCE_INPUT" || "$GO_SOURCE_INPUT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::go_source must be 40 hex"; exit 1; }
          head="$(git rev-parse HEAD)"
          # Some recorders (drain) run `go test` on the current checkout, not a separate worktree, so the
          # recorded source is always this checkout: dispatch with the frozen ref instead.
          [[ -z "$GO_SOURCE_INPUT" || "$GO_SOURCE_INPUT" == "$head" ]] || { echo "::error::go_source $GO_SOURCE_INPUT is not the checked-out commit $head; dispatch this workflow on that ref"; exit 1; }
          if [ "$GOFREE_REC_UPSTREAM" = authserverd ]; then
            # per-target Go config is only established for these auth oracles (oidc, rp, saml, push need their own presets)
            case "$GOFREE_REC_PACKAGE/$GOFREE_REC_TEST" in
              setjoin-auth/oracle|setjoin-auth/token_oracle|setjoin-auth/mfa_oracle|setjoin-auth/webauthn_oracle) ;;
              *) echo "::error::go_upstream=authserverd supports only setjoin-auth tests oracle, token_oracle, mfa_oracle, webauthn_oracle"; exit 1 ;;
            esac
          fi
          echo "GOFREE_GO_SOURCE=$head" >> "$GITHUB_ENV"
      - uses: ./.github/actions/lane-setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server-rust -> ../../../../lane-build/target
          shared-key: lane
          save-if: false
      - name: Build the frozen Go coverage binary
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE" out="$RUNNER_TEMP/go-bin"
          mkdir -p "$out"
          # setjoin-ci-linux-tc is also the image the oracle runs the binary in (same libc)
          docker run --rm -v "$src:/src:ro" -v "$out:/out" -v "$LANE_CACHE/go-mod:/go-mod" -e GOMODCACHE=/go-mod \
            -w /src setjoin-ci-linux-tc:local-amd64 \
            go build -cover -o /out/mailserverd ./mailserver/cmd/mailserverd
          echo "GOFREE_RECORD_GO_BINARY=$out/mailserverd" >> "$GITHUB_ENV"
          if [ "$GOFREE_REC_UPSTREAM" = authserverd ]; then
            docker run --rm -v "$src:/src:ro" -v "$out:/out" -v "$LANE_CACHE/go-mod:/go-mod" -e GOMODCACHE=/go-mod \
              -w /src setjoin-ci-linux-tc:local-amd64 \
              go build -cover -o /out/authserverd ./authserver/cmd/authserverd
            echo "GOFREE_AUTHSERVERD_BINARY=$out/authserverd" >> "$GITHUB_ENV"
            echo "GOFREE_AUTH_SRC=$src" >> "$GITHUB_ENV"
          fi
          echo "frozen Go source $GOFREE_GO_SOURCE"
      - name: Record
        run: bash scripts/lane-container.sh bash scripts/gofree-record.sh
      - name: Stop and remove every container this job started
        if: always()
        run: |
          set -uo pipefail
          # exact owned set: every container not present before the job (lane execution container, lane Postgres,
          # auth recorder, oracle containers such as the fixed-name office recorder)
          owned() { docker ps -aq | sort | comm -13 "$RUNNER_TEMP/containers-before.txt" - ; }
          ids="$(owned)"
          if [ -n "$ids" ]; then
            echo "$ids" | xargs docker stop --time 10 >/dev/null 2>&1 || echo "::warning::stop reported failures"
            echo "$ids" | xargs docker rm -f >/dev/null 2>&1 || echo "::warning::removal reported failures"
          fi
          left="$(owned)"
          [ -z "$left" ] || { echo "::error::owned containers remain after cleanup: $(echo "$left" | tr '\n' ' ')"; exit 1; }
      - name: Collect new goldens and diff
        if: always()
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -f lane-artifacts/manifest.ok
          out=lane-artifacts/recorded
          mkdir -p "$out"
          git status --porcelain > lane-artifacts/git-status.txt
          # manifests first: `git add -N` would turn the new files into tracked ones
          git ls-files --others --exclude-standard server-rust > lane-artifacts/new-files.txt
          { git diff --name-only --diff-filter=MD; git ls-files -d; } | sort -u > lane-artifacts/modified-tracked.txt
          while IFS= read -r f; do mkdir -p "$out/$(dirname "$f")"; cp -p "$f" "$out/$f"; done < lane-artifacts/new-files.txt
          git add -N server-rust
          git diff > lane-artifacts/changes.diff
          # provenance: every new file must stamp go_source == the checked-out commit
          if python3 -I scripts/gofree-record-check.py "$(git rev-parse HEAD)" lane-artifacts/new-files.txt > lane-artifacts/provenance-failures.txt; then
            : > lane-artifacts/provenance.ok
          else
            rm -f lane-artifacts/provenance.ok
          fi
          {
            echo "### gofree record: ${GOFREE_REC_PACKAGE} --test ${GOFREE_REC_TEST} ${GOFREE_REC_FILTER}"
            echo "- go_upstream \`${GOFREE_REC_UPSTREAM}\`, frozen Go source \`${GOFREE_GO_SOURCE:-unknown}\`"
            echo "- new files: $(wc -l < lane-artifacts/new-files.txt), modified or deleted tracked files: $(wc -l < lane-artifacts/modified-tracked.txt)"
            echo '```'; head -60 lane-artifacts/git-status.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          : > lane-artifacts/manifest.ok
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: gofree-record
          path: lane-artifacts/
          retention-days: 14
      - name: Refuse unsafe results
        if: always()
        run: |
          set -euo pipefail
          [ -e lane-artifacts/manifest.ok ] || { echo "::error::the evidence step did not complete; cannot vouch for tracked files"; exit 1; }
          if [ -s lane-artifacts/modified-tracked.txt ]; then
            echo "::error::recording modified or deleted committed files (only new goldens are allowed):"
            cat lane-artifacts/modified-tracked.txt
            exit 1
          fi
          if [ ! -e lane-artifacts/provenance.ok ]; then
            echo "::error::new files without go_source provenance equal to the checked-out commit (oracles must stamp GOFREE_GO_SOURCE):"
            cat lane-artifacts/provenance-failures.txt
            exit 1
          fi
