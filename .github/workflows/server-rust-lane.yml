name: server-rust lane

# The Go-free Rust server lane on GitHub-hosted runners (no self-hosted runner anywhere).
# STAGE 2 of the merge-queue rollout (stage 1 kept `pull_request` here): the FULL lane runs on the
# merge queue's merge-group commit, and on workflow_dispatch. Every queue entry gets its own run.
# Merge-queue batching (only with repo variable LANE_QUEUE_BATCHING=1 and the ruleset on HEADGREEN):
# the `queue` job decides per entry. An entry with a LATER queued entry (one whose commit descends from
# ours, i.e. a batch that includes ours) WAITS: its run stays in progress, its queue job polls every 60 s
# and runs no lane. Its `aggregate` stays pending, never green or red, until the entry is merged with the
# later batch (its ref is then gone and the run ends `gone`) or the wait ends. The entry with no later
# entry (the batch head) runs the full lane on its own commit, which contains every earlier entry. The
# switch unset or any other event: `queue` prints head at once, so every entry runs the full lane, as before.
# A later entry whose own lane run already concluded with anything but success does not count as later: GitHub
# can keep a failed entry's ref queued while the earlier entries wait, so the `queue` job asks the Actions API
# (actions: read, GH_TOKEN, merge_group runs only) on every poll and an unknown answer keeps the entry waiting.
# Worst case for one entry: SETTLE 120 s + CAP 5400 s + the lane; the queue job's timeout is 110 minutes.
# An ls-remote/fetch error is "unknown": the entry keeps waiting and retries; at the CAP it runs the full lane
# itself (slower, never unsafe). An entry that leaves the queue while waiting ends `gone` without running.
# A check_response_timeout (360 min) overrun ejects the entry; that fails closed and never merges it.
# Pull requests do NOT run it: the required `aggregate` on a PR comes from
# pr-precheck.yml (light pre-check + selected integration tests), and the merge queue then requires this workflow's `aggregate`
# on the batch. Apply only with the merge-queue ruleset active.
# What main does (the plan job's `mode` output; the queue already tested what lands on main):
#   push to main     mode=cache  CACHE REFRESH ONLY: build + coverage-build + gomod-cache save the caches, no
#                                test, coverage, replay or guard job runs; the run is NOT a test pass
#   schedule 02:30   mode=full   the FULL lane plus coverage, the backstop (also saves caches); mode=skip
#                                (green, summary says why) when main had no commit in the last 26 hours
#   merge_group, workflow_dispatch   mode=full, unchanged (a queue entry whose queue role is `gone` is mode=gone
#                                    instead: its ref left the queue while waiting; no job runs; aggregate is RED
#                                    with "nothing ran; not a test pass"; the red sits on a commit nothing reads)
# The lane jobs:
#   queue           first on every run: a merge_group entry with the switch on decides head|gone (waits while a
#                   later entry is queued, see above); every other run prints head without any network call
#   plan            decides debug, full, cache, skip or gone, and the shard lists
#   gomod-cache     (mode=cache only) go mod download + save of the Go module cache (shard 1 saves it in full mode)
#   build           one nextest archive of every workspace test binary + the expected test list
#   roots           static guards, cargo-deny, doc tests, pilot, schema-simulation, bench-mark-read
#   pgtap           reducer pgTAP suites (mailserver + authserver) on the lane Postgres
#   guards          every scripts/check-*.sh structural/security guard via run-guards.sh, self-tests first
#   shard 1..N      nextest partition k/N + every N-th replay/mutant, each shard its own VM and Postgres
#   coverage-build  one instrumented archive of the coverage binaries only
#   coverage 1..M   every M-th oracle coverage entry
#   aggregate       the required check: every job green AND every test, replay, mutant and
#                   coverage entry ran exactly once (scripts/merge-lane-shards.py)
# workflow_dispatch keeps the debug inputs: filter or adequacy_only runs ONE job, never a lane result.
# Fork pull requests get a read-only token and no secrets (the lane needs none: the Postgres
# password is generated per job) and never save a cache; only runs on main (push, schedule, dispatch) save caches.
on:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      shards:
        description: Test shards (1-12)
        default: '8'
      coverage_shards:
        description: Coverage shards (1-12)
        default: '6'
      jobs:
        description: Concurrent tests per shard
        default: '4'
      filter:
        description: Debug only - nextest filterset; one job, never a lane result
        default: ''
      adequacy_only:
        description: Debug only - adequacy stages (replays, coverage or replays,coverage); one job, never a lane result
        default: ''
      adequacy_entries:
        description: With adequacy_only - comma-separated route entries (empty = all)
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  # github.event.pull_request.number is empty on merge_group; github.ref is then the unique
  # refs/heads/gh-readonly-queue/... of that queue entry, so batches never share a group. The event name
  # is part of the key, so the nightly (ref refs/heads/main) never queues behind a push-to-main refresh.
  group: server-rust-lane-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: '5'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  LANE_JOBS: ${{ inputs.jobs || '4' }}
  GOFREE_AIRGAP_FIXTURE_ROOT: /dev/shm

jobs:
  # Merge-queue batching decision (scripts/lane-job-gate.py queue-role). ls-remote and fetch are anonymous reads of
  # the public repository. actions: read is for one Actions API GET per later ref (failed_later_from_api): a later
  # ref whose lane run already failed no longer holds us back. The token is used only with the switch on, on a
  # merge_group event. Timeout 110 min is above CAP (90 min) plus the worst I/O of one poll (255 s) plus setup
  # margin. Every git and curl child is killed at its own timeout (subprocess.run), so the script exits by itself;
  # a cancelled job would be red.
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
      actions: read
    outputs:
      role: ${{ steps.role.outputs.role }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            scripts/lane-job-gate.py
      - id: role
        env:
          EVENT: ${{ github.event_name }}
          OWN_REF: ${{ github.ref }}
          OWN_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          BATCHING: ${{ vars.LANE_QUEUE_BATCHING }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          role="$(python3 scripts/lane-job-gate.py queue-role)"
          echo "role=$role" >> "$GITHUB_OUTPUT"
          echo "queue role: $role (event=$EVENT)"

  plan:
    needs: queue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      debug: ${{ steps.plan.outputs.debug }}
      mode: ${{ steps.mode.outputs.mode }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      coverage_shards: ${{ steps.plan.outputs.coverage_shards }}
      coverage_count: ${{ steps.plan.outputs.coverage_count }}
    steps:
      # Fail fast and loudly while the image pins are still the bootstrap placeholders (every other
      # job needs plan, so nothing else starts and nothing hangs).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/ci
            scripts/lane-job-gate.py
      - name: images.lock must be pinned
        run: |
          if grep -v '^#' .github/ci/images.lock | grep -q PLACEHOLDER; then
            echo "::error title=images.lock not pinned::.github/ci/images.lock still has PLACEHOLDER digests. Open the 'CI images' workflow run for this change (it runs on same-repo pull requests), copy the images.lock block from its job summary into .github/ci/images.lock, make the new ghcr.io/setjoin packages public once, and push."
            exit 1
          fi
      # mode: full (merge_group, workflow_dispatch, nightly with news), cache (push to main) or skip (nightly, no news).
      # Nightly skip rule: skip unless main has a commit newer than 26 hours (one daily slot plus cron jitter).
      # Simpler than "since the last successful scheduled run": it needs no run-history lookup. A night that
      # fails or is missed is NOT retried by the next night (a commit older than 26 hours is skipped then); re-run it
      # by hand. The cost of the window is at most one redundant full run (the mode and verdict rules live in scripts/lane-job-gate.py, tested by
      # scripts/test-lane-job-gate.py). Uses the commits API (contents: read), no checkout depth needed.
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_ROLE: ${{ needs.queue.outputs.role }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          n=""
          if [ "$EVENT" = schedule ]; then
            since="$(date -u -d '26 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
            n="$(gh api "repos/$REPO/commits?sha=main&since=$since&per_page=1" --jq 'length')" # an API error fails the job (red), never skips
            echo "nightly: $n commit(s) on main since $since"
          fi
          mode="$(python3 scripts/lane-job-gate.py mode "$EVENT" $n)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT mode=$mode"
      - id: plan
        env:
          DEBUG: ${{ inputs.filter }}${{ inputs.adequacy_only }}
          SHARDS: ${{ inputs.shards || '8' }}
          COVERAGE: ${{ inputs.coverage_shards || '6' }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          n, m = (max(1, min(12, int(os.environ[k]))) for k in ("SHARDS", "COVERAGE"))
          print("debug=" + ("true" if os.environ["DEBUG"] else "false"))
          print(f"shards={json.dumps(list(range(1, n + 1)))}\nshard_count={n}")
          print(f"coverage_shards={json.dumps(list(range(1, m + 1)))}\ncoverage_count={m}")
          PY

  debug:
    needs: plan
    if: needs.plan.outputs.debug == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LANE_JOB_TAG: debug
      LANE_QUICK: ${{ inputs.filter && '1' || '' }}
      LANE_NEXTEST_FILTER: ${{ inputs.filter }}
      LANE_ADEQUACY_ONLY: ${{ inputs.adequacy_only }}
      LANE_ADEQUACY_ENTRIES: ${{ inputs.adequacy_entries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/lane-setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server-rust -> ../../../../lane-build/target
          shared-key: lane
          save-if: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/setjoin-server-rust-lane/go-mod
          key: lane-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: lane-go-mod-
      - name: Run the lane (debug, not a lane result)
        run: bash scripts/lane-container.sh bash scripts/server-rust-parallel-lane.sh
      - name: Summary
        if: always()
        run: |
          {
            echo "### server-rust lane (debug)"
            echo "- **DEBUG run, not a lane result**: filter \`${LANE_NEXTEST_FILTER:0:300}\`, adequacy stages \`${LANE_ADEQUACY_ONLY}\`, entries \`${LANE_ADEQUACY_ENTRIES:0:300}\`"
            { grep -E '^(✓|✗)|^replay summary|^coverage summary|Summary \[' lane-artifacts/lane.log | tail -30 | sed 's/^/- `/; s/$/`/'; } || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: lane-result-debug
          path: lane-artifacts/
          retention-days: 7

  # mode=cache only: the Go module cache that shard 1 saves in full mode, without any test shard.
  gomod-cache:
    needs: plan
    if: needs.plan.outputs.mode == 'cache' && needs.plan.outputs.debug != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - id: gomod
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/setjoin-server-rust-lane/go-mod
          key: lane-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: lane-go-mod-
      - name: Download every Go module into the lane module cache
        run: |
          set -euo pipefail
          export GOMODCACHE="$HOME/.cache/setjoin-server-rust-lane/go-mod"
          mkdir -p "$GOMODCACHE"
          go mod download # workspace mode (go.work): every module the lane builds
          for d in $(find . -name go.mod -not -path '*/node_modules/*' -exec dirname {} \;); do
            (cd "$d" && GOWORK=off go mod download) || echo "::warning::go mod download failed outside the workspace in $d"
          done
          du -sh "$GOMODCACHE"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.ref == 'refs/heads/main' && steps.gomod.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/setjoin-server-rust-lane/go-mod
          key: lane-go-mod-${{ hashFiles('**/go.sum') }}

  build:
    needs: plan
    if: needs.plan.outputs.debug != 'true' && needs.plan.outputs.mode != 'skip' && needs.plan.outputs.mode != 'gone'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LANE_JOB_TAG: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/lane-setup
        with:
          postgres: 'false'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server-rust -> ../../../../lane-build/target
          shared-key: lane
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the test archive and the expected test list
        run: |
          bash scripts/lane-container.sh bash -c 'set -euo pipefail; cd server-rust
            cargo nextest archive --workspace --locked --archive-file "$LANE_BUILD/lane-tests.tar.zst"
            cargo nextest list --workspace --locked --message-format json >"$LANE_ARTIFACT_DIR/lane-list.json"'
          ls -la "$LANE_BUILD/lane-tests.tar.zst"
          # an ignored test is red, as in run_root (the shards cannot see it: partitions count as skipped)
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); bad=[f"{b}::{t}" for b,s in d["rust-suites"].items() for t,c in s["testcases"].items() if c.get("ignored")]; print("\n".join(bad)); sys.exit(f"{len(bad)} ignored test(s)" if bad else 0)' lane-artifacts/lane-list.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lane-archive
          path: ${{ env.LANE_BUILD }}/lane-tests.tar.zst
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lane-list
          path: lane-artifacts/lane-list.json
          retention-days: 14

  roots:
    needs: plan
    if: needs.plan.outputs.debug != 'true' && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LANE_JOB_TAG: roots
      SERVER_RUST_STAGES: static,roots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/lane-setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server-rust -> ../../../../lane-build/target
          shared-key: lane
          save-if: false
      - name: Static guards, cargo-deny, pilot, schema-simulation, bench-mark-read, doc tests, SAML ACS mutants
        run: bash scripts/lane-container.sh bash scripts/server-rust-parallel-lane.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: lane-result-roots
          path: lane-artifacts/
          retention-days: 14

  pgtap:
    # The reducer pgTAP suites (mailserver + authserver). The retired Go lane was the only CI that ran them.
    # Same procedure as the old unit-tests job: load the schema once, run pg_prove verbosely, verify the TAP evidence.
    needs: plan
    if: needs.plan.outputs.debug != 'true' && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANE_JOB_TAG: pgtap
      DB_HOST: 127.0.0.1
      DB_USER: postgres
      DB_NAME: mailserver_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/lane-setup
      - name: Install psql and pg_prove
        run: |
          { command -v psql && command -v pg_prove; } >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client libtap-parser-sourcehandler-pgtap-perl libdbd-pg-perl
          }
      - name: Load test schema (baseline + forward migrations + reducers + fixtures)
        run: |
          export DB_PORT="$LANE_PG_PORT"
          bash scripts/load-test-schema.sh
      - name: Run pgTAP reducer suites
        run: |
          export DB_PORT="$LANE_PG_PORT"
          # Suites in scripts/pgtap-known-red.txt (issues #401-#404) run and warn; every other suite must pass.
          bash scripts/run-pgtap-lane.sh scripts/pgtap-known-red.txt -h 127.0.0.1 -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME"
      - name: Verify named pgTAP evidence
        run: TEST_EVIDENCE_OUTPUT=test-results/pgtap/test-evidence.json bash scripts/check-test-evidence-results.sh --verify tap
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pgtap-result
          if-no-files-found: warn
          path: test-results/pgtap/
          retention-days: 14

  guards:
    # The structural and security guards (audit coverage, RLS denial/allow, cargo supply chain, ...), self-tests first.
    # The retired Xinchuang unit-tests job was the only CI that ran them. Guards red since the Go removal are listed
    # in scripts/guards-known-red.txt (issue #348): they still run and warn, and any other guard failing is red.
    needs: plan
    if: needs.plan.outputs.debug != 'true' && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANE_JOB_TAG: guards
      DB_HOST: 127.0.0.1
      DB_USER: postgres
      DB_NAME: mailserver_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 } # check-architecture-r5-collisions.sh needs origin/main
      - uses: ./.github/actions/lane-setup
      # Provisioning copied from the retired xinchuang-ci.yml unit-tests job (same pinned versions): the guards
      # run on the host, and lane-setup only pulls the toolchain images.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install psql, pg_prove and ripgrep
        run: |
          { command -v psql && command -v pg_prove && command -v rg; } >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client libtap-parser-sourcehandler-pgtap-perl libdbd-pg-perl ripgrep
          }
      - name: Install webmail dependencies (guards shell into webmail tooling)
        # check-app-catalog / check-harmony-bridge / check-native-contract-conformance / route-inventory self-tests
        # invoke node_modules tooling under mailserver/webmail (ERR_MODULE_NOT_FOUND without it).
        working-directory: mailserver/webmail
        run: npm ci
      - name: Install pinned quality tools
        # Guards verify exact versions (config/quality-tool-versions.json); the errcheck ratchet is golangci-lint-version-sensitive.
        run: |
          TOOLS="$HOME/.local/setjoin-ci-tools"
          mkdir -p "$TOOLS"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$TOOLS" v2.13.2
          GOBIN="$TOOLS" go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          GOBIN="$TOOLS" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          RUFF_TMP="$(mktemp -d)"
          curl -fsSL https://github.com/astral-sh/ruff/releases/download/0.16.4/ruff-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$RUFF_TMP"
          install -m 0755 "$RUFF_TMP"/ruff-x86_64-unknown-linux-musl/ruff "$TOOLS/ruff"
          rm -rf "$RUFF_TMP"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$TOOLS" gitleaks
          echo "$TOOLS" >> "$GITHUB_PATH"
      - name: Build webmail (performance guard input)
        working-directory: mailserver/webmail
        run: npm run build
      - name: Install cargo-deny for the Rust workspace policy
        run: |
          rustup component add llvm-tools # check-server-rust's coverage-report self-test needs llvm-profdata/llvm-cov
          cargo install cargo-deny --locked --version 0.19.0
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH" # the license-policy test replaces CARGO_HOME
      - name: Point the guards at the lane Postgres
        # lane-setup exported PGPASSWORD for the postgres superuser on LANE_PG_PORT; check-guc-afterconnect reads DB_DSN.
        run: |
          {
            echo "DB_PORT=$LANE_PG_PORT"
            echo "DB_DSN=postgres://postgres:${PGPASSWORD}@127.0.0.1:${LANE_PG_PORT}/${DB_NAME}?sslmode=disable"
            echo "TEST_DB_DSN=postgres://postgres:${PGPASSWORD}@127.0.0.1:${LANE_PG_PORT}/${DB_NAME}?sslmode=disable"
          } >> "$GITHUB_ENV"
      - name: Load test schema (the DB-backed guards run against it)
        run: bash scripts/load-test-schema.sh
      - name: Run every guard (self-test first)
        # check-server-rust.sh runs its static stage only (family isolation, cargo-deny, policy tests): the
        # workspace, roots and adequacy stages belong to the build, roots and shard jobs of this lane.
        env:
          SERVER_RUST_STAGES: static
        run: |
          bash scripts/run-guards-selftest.sh
          bash scripts/run-guards.sh --known-red scripts/guards-known-red.txt

  shard:
    needs: [plan, build]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      LANE_JOB_TAG: shard-${{ matrix.shard }}
      LANE_COVERAGE: '0'
      SERVER_RUST_STAGES: workspace,adequacy
      SERVER_RUST_NEXTEST_PARTITION: hash:${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }}
      LANE_ADEQUACY_SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/lane-setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lane-archive
          path: ${{ runner.temp }}/archive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lane-list
          path: ${{ runner.temp }}/list
      - id: gomod
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/setjoin-server-rust-lane/go-mod
          key: lane-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: lane-go-mod-
      - name: Shard ${{ matrix.shard }} (nextest partition and replay slice)
        run: |
          python3 scripts/lane-binaries.py "$RUNNER_TEMP/list/lane-list.json" >"$LANE_ARTIFACT_DIR/binaries.json"
          SERVER_RUST_NEXTEST_ARCHIVE="$RUNNER_TEMP/archive/lane-tests.tar.zst" \
          SERVER_RUST_NEXTEST_EXTRACT_TO="$LANE_BUILD" \
          LANE_ADEQUACY_BINARIES="$LANE_ARTIFACT_DIR/binaries.json" \
            bash scripts/lane-container.sh bash scripts/server-rust-parallel-lane.sh
      # one shard saves the Go module cache, and only from main (a pull request never writes a cache)
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && github.ref == 'refs/heads/main' && matrix.shard == 1 && steps.gomod.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/setjoin-server-rust-lane/go-mod
          key: lane-go-mod-${{ hashFiles('**/go.sum') }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: lane-result-shard-${{ matrix.shard }}
          path: lane-artifacts/
          retention-days: 14

  coverage-build:
    needs: plan
    if: needs.plan.outputs.debug != 'true' && needs.plan.outputs.mode != 'skip' && needs.plan.outputs.mode != 'gone'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LANE_JOB_TAG: coverage-build
      RUSTFLAGS: -C instrument-coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/lane-setup
        with:
          postgres: 'false'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server-rust -> ../../../../lane-build/target
          shared-key: lane-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the instrumented archive (coverage binaries only)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-profiles"
          LANE_COVERAGE_TARGETS="$(python3 scripts/check-gofree-oracle-adequacy.py --print-coverage-targets)" \
          LLVM_PROFILE_FILE="$RUNNER_TEMP/build-profiles/%p-%m.profraw" \
            bash scripts/lane-container.sh bash -c 'set -euo pipefail; cd server-rust
              read -r -a sel <<<"$LANE_COVERAGE_TARGETS"
              cargo nextest archive "${sel[@]}" --locked --archive-file "$LANE_BUILD/coverage-tests.tar.zst"
              cargo nextest list "${sel[@]}" --locked --message-format json >"$LANE_ARTIFACT_DIR/coverage-list.json"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lane-coverage-archive
          path: ${{ env.LANE_BUILD }}/coverage-tests.tar.zst
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lane-coverage-list
          path: lane-artifacts/coverage-list.json
          retention-days: 14

  coverage-shard:
    needs: [plan, coverage-build]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.coverage_shards) }}
    env:
      LANE_JOB_TAG: coverage-${{ matrix.shard }}
      LANE_COVERAGE: '1'
      LANE_ADEQUACY_COVERAGE_ONLY: '1'
      SERVER_RUST_STAGES: adequacy
      LANE_ADEQUACY_SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.coverage_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/lane-setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lane-coverage-archive
          path: ${{ runner.temp }}/archive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lane-coverage-list
          path: ${{ runner.temp }}/list
      - name: Coverage shard ${{ matrix.shard }}
        run: |
          python3 scripts/lane-binaries.py "$RUNNER_TEMP/list/coverage-list.json" >"$LANE_ARTIFACT_DIR/binaries.json"
          LANE_COVERAGE_ARCHIVE="$RUNNER_TEMP/archive/coverage-tests.tar.zst" \
          LANE_ADEQUACY_BINARIES="$LANE_ARTIFACT_DIR/binaries.json" \
            bash scripts/lane-container.sh bash -c 'set -euo pipefail
              (cd server-rust && cargo nextest list --archive-file "$LANE_COVERAGE_ARCHIVE" --workspace-remap . \
                --extract-to "$LANE_BUILD" --extract-overwrite >/dev/null)
              bash scripts/server-rust-parallel-lane.sh'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: lane-result-coverage-${{ matrix.shard }}
          path: lane-artifacts/
          retention-days: 14

  # The required check. Red unless every job is green and the merge finds every test, replay,
  # mutant and coverage entry run exactly once (a skipped job is never a pass).
  # Only mode=full (merge_group, workflow_dispatch, nightly with news) is a test pass. A push to main
  # (mode=cache) is green when the cache jobs are, and a quiet nightly (mode=skip) when plan is; both say
  # so in the step summary. merge_group and workflow_dispatch are red unless plan chose mode=full, so a
  # mis-planned or skipped queue run can never pass vacuously.
  aggregate:
    needs: [plan, debug, build, roots, pgtap, guards, shard, coverage-build, coverage-shard, gomod-cache, queue]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Job results (scripts/lane-job-gate.py; its tests run first)
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 scripts/test-lane-job-gate.py
          python3 scripts/lane-job-gate.py verdict
      - name: Summary (cache refresh or skipped nightly)
        if: always() && needs.plan.outputs.mode != 'full'
        env:
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          if [ "$MODE" = cache ]; then
            echo "### server-rust lane: cache refresh only, no tests" >> "$GITHUB_STEP_SUMMARY"
            echo "A push to main only rebuilds and saves the cargo caches (build, coverage-build) and the Go module cache (gomod-cache). No test, replay, coverage or guard job ran: this is **not** a test pass. The merge queue tested this commit before it landed; the nightly full lane is the backstop." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MODE" = skip ]; then
            echo "### server-rust lane: nightly skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No commit landed on main in the last 26 hours, so no full lane was due. Nothing ran: this is **not** a test pass." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MODE" = gone ]; then
            echo "### server-rust lane: queue entry left the queue; nothing ran" >> "$GITHUB_STEP_SUMMARY"
            echo "This merge-queue entry was waiting behind a later entry, and its queue branch was removed (merged with that batch, ejected or rebuilt) before its lane was due. Nothing ran: this is **not** a test pass. The red result is expected and cosmetic: the commit it sits on is no longer in the queue." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: always() && needs.plan.outputs.debug == 'false' && needs.plan.outputs.mode == 'full'
        with:
          pattern: lane-result-*
          path: results
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: always() && needs.plan.outputs.debug == 'false' && needs.plan.outputs.mode == 'full' && needs.build.result == 'success'
        with:
          name: lane-list
          path: results/lane-list
      - name: Merge the shards
        if: always() && needs.plan.outputs.debug == 'false' && needs.plan.outputs.mode == 'full' && needs.build.result == 'success'
        env:
          SHARDS: ${{ needs.plan.outputs.shard_count }}
          COVERAGE: ${{ needs.plan.outputs.coverage_count }}
        run: |
          set -o pipefail
          python3 scripts/merge-lane-shards.py --list results/lane-list/lane-list.json --results results \
            --shards "$SHARDS" --coverage-shards "$COVERAGE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Go-deletion rehearsal (#141)
        if: always() && needs.plan.outputs.debug == 'false' && needs.plan.outputs.mode == 'full'
        env:
          SHARDS: ${{ needs.plan.outputs.shard_count }}
          COVERAGE: ${{ needs.plan.outputs.coverage_count }}
        run: |
          set -o pipefail
          python3 scripts/check-gofree-rehearsal.py lane results --shards "$SHARDS" \
            --coverage-shards "$COVERAGE" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && needs.plan.outputs.debug == 'false' && needs.plan.outputs.mode == 'full'
        with:
          name: lane-results-${{ github.sha }}
          path: |
            results/lane-result-*/
            results/lane-list/
          retention-days: 30
