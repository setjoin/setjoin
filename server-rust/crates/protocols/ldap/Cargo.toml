[package]
name = "setjoin-ldap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
oracle-mutants = []

[dependencies]
setjoin-threat = { path = "../../threat" }
setjoin-authz = { path = "../../authz" }
ldap3_proto = "=0.9.0"
ldap3_lber = "=0.9.0"
bytes = "=1.12.1"
tokio-util = { version = "=0.7.20", features = ["codec"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
tokio = { version = "=1.54.1", features = ["net", "io-util", "rt", "sync", "time", "macros"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
setjoin-pg = { path = "../../pg" }
serde_json = "=1.0.145"

[dev-dependencies]
setjoin-conformance = { path = "../../../tests/conformance" }
