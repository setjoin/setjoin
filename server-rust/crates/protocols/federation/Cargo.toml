[package]
name = "setjoin-federation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
setjoin-pg = { path = "../../pg" }
bytes = "=1.12.1"
tokio = { version = "=1.54.1", features = ["net", "io-util", "rt", "sync", "time", "macros"] }
tokio-util = { version = "=0.7.20", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
tokio-postgres = "0.7.18"
rustls-pki-types = "=1.15.1"
webpki = { package = "rustls-webpki", version = "=0.103.16", default-features = false, features = ["ring", "std"] }
x509-parser = "=0.18.1"
base64 = "=0.22.1"
regex = "=1.13.1"
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["system-config", "tokio"] }

[dev-dependencies]
setjoin-conformance = { path = "../../../tests/conformance" }
serde_json = "=1.0.145"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
url = "=2.5.8"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
