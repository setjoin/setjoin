[package]
name = "setjoin-imap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Test-only: restores the frozen-Go IDLE slot leak (SETJOIN_SECFIX3_MUTANT).
oracle-mutants = ["setjoin-contracts/oracle-mutants"]

[dependencies]
setjoin-threat = { path = "../../threat" }
setjoin-authz = { path = "../../authz" }
setjoin-contracts = { path = "../../contracts" }
setjoin-db = { path = "../../db" }
setjoin-pg = { path = "../../pg" }
base64 = "=0.22.1"
sha2 = "=0.10.9"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
tokio = { version = "=1.54.1", features = ["net", "io-util", "rt", "sync", "time", "macros"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
serde_json = "=1.0.145"

[dev-dependencies]
setjoin-conformance = { path = "../../../tests/conformance" }
tokio-postgres = "0.7.18"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
