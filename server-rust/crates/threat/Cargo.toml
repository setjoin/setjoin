[package]
name = "setjoin-threat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
setjoin-pg = { path = "../pg" }
setjoin-authz = { path = "../authz" }
setjoin-contracts = { path = "../contracts" }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
serde_json = "=1.0.145"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "gzip"] }
sha2 = "=0.10.9"
futures-util = "=0.3.34"

[dev-dependencies]
tokio-postgres = "=0.7.18"
