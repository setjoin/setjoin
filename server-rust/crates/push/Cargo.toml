[package]
name = "setjoin-push"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono = "=0.4.45"
base64 = "=0.22.1"
serde_json = "=1.0.145"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "http2"] }
ring = "=0.17.14"
p12-keystore = "=0.4.1"
p256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "std", "pem"] }
tokio = { version = "1.54", features = ["net"] }
url = "=2.5.8"

[features]
# Enabled only by mailctl's dev dependency for process-oracle loopback peers.
oracle-loopback = []
