[package]
name = "setjoin-conditional-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
oracle-mutants = ["setjoin-contracts/oracle-mutants", "setjoin-authz/oracle-mutants"]

[dependencies]
setjoin-authz = { path = "../../authz" }
setjoin-contracts = { path = "../../contracts" }
setjoin-db = { path = "../../db" }
setjoin-pg = { path = "../../pg" }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
sha2 = "=0.10.9"

chrono = "=0.4.45"
chrono-tz = "=0.10.4"
ipnet = "=2.12.2"
tokio = { version = "=1.54.1", features = ["sync", "time"] }

[dev-dependencies]
setjoin-conformance = { path = "../../../tests/conformance" }
tokio-postgres = "=0.7.18"
