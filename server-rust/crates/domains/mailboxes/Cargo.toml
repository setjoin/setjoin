[package]
name = "setjoin-mailboxes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
setjoin-mime = { path = "../../mime" }
setjoin-authz = { path = "../../authz" }
setjoin-contracts = { path = "../../contracts" }
setjoin-db = { path = "../../db" }
setjoin-pg = { path = "../../pg" }
base64 = "=0.22.1"
ring = "=0.17.14"
serde_json = "=1.0.145"
flate2 = "=1.1.9"
# Mailbox import reads ZIP uploads (#425); the export writer is our own.
zip = { version = "=9.2.2", default-features = false, features = ["deflate-flate2"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["alloc", "zeroize"] }
sm4 = { version = "=0.5.1", default-features = false, features = ["zeroize"] }
zeroize = "=1.9.1"
