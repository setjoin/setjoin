[package]
name = "setjoin-jmap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Mail-domain commands use workspace foundation crates. Database drivers stay
# behind setjoin-pg; shared mailbox read grants live in setjoin-authz.
[lib]
name = "setjoin_jmap"
path = "src/lib.rs"

[dependencies]
setjoin-authz = { path = "../../authz" }
setjoin-contracts = { path = "../../contracts" }
setjoin-db = { path = "../../db" }
setjoin-pg = { path = "../../pg" }

# Test-only: the conformance harness (DB gate, fixtures) and a runtime.
[dev-dependencies]
setjoin-conformance = { path = "../../../tests/conformance" }
tokio = { version = "1.54", features = ["rt", "macros", "time", "sync", "net", "io-util"] }
tokio-postgres = "0.7.18"
