[package]
name = "setjoin-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "setjoin_search"
path = "src/lib.rs"

[dependencies]
arc-swap = "=1.9.5"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
hex = "=0.4.3"
hmac = "=0.12.1"
jieba-rs = { version = "=0.11.0", default-features = false }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
setjoin-contracts = { path = "../contracts" }
setjoin-pg = { path = "../pg" }
sha2 = "=0.10.9"
tantivy = { version = "=0.27.0", default-features = false, features = ["mmap", "lz4-compression"] }
tokio = { version = "=1.54.1", features = ["rt", "sync", "time", "macros"] }
tokio-postgres = { version = "=0.7.18", features = ["with-chrono-0_4"] }

[dev-dependencies]
setjoin-authz = { path = "../authz" }
setjoin-conformance = { path = "../../tests/conformance" }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
