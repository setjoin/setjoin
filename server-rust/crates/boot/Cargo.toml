[package]
name = "setjoin-boot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
setjoin-pg = { path = "../pg" }
setjoin-schema = { path = "../schema" }
serde_json = "=1.0.145"
serde = { version = "=1.0.229", features = ["derive"] }
ring = "=0.17.14"
setjoin-authz = { path = "../authz" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
futures-util = "=0.3.34"
rust-s3 = { version = "=0.38.0", default-features = false, features = ["with-tokio"] }
base64 = "=0.22.1"
md-5 = "=0.10.6"
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
libc = "=0.2.191"
zeroize = "=1.9.1"
setjoin-config-secret = { path = "../config-secret" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
quick-xml = { version = "=0.41.0", features = ["serialize"] }
