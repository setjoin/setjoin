[package]
name = "setjoin-workqueue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "setjoin_workqueue"
path = "src/lib.rs"

[features]
default = []
# Privileged worker execution (WorkerPool / WorkerTx). Forbidden in default and
# in all crates/domains/* crates (enforced by scripts/check-rust-family-isolation.py).
worker = ["setjoin-pg/worker-pool"]
# Standalone OperatorConnection DLQ inspection/replay/purge helpers for mailctl.
operator = []

[dependencies]
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
setjoin-pg = { path = "../pg" }
tokio = { version = "=1.54.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.20", default-features = false }

[dev-dependencies]
setjoin-conformance = { path = "../../tests/conformance" }
setjoin-contracts = { path = "../contracts" }
setjoin-pg = { path = "../pg", features = ["worker-pool"] }
setjoin-workqueue = { path = ".", features = ["worker", "operator"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time"] }
tokio-postgres = "0.7.18"
