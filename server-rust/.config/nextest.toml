# nextest profile for the server-rust parallel full lane (#550); see
# docs/guides/VERIFICATION_COMMANDS.md and server-rust/AGENTS.md.
#
# Only the `lane` profile exists: plain `cargo test` stays the serial reference lane.
# Each test runs in its own process through the DB wrapper, which clones a private
# database from the schema-loaded template (nothing here weakens a test). The serial
# groups (docker, fixed ports, /dev/shm) are generated by
# scripts/server-rust-lane-groups.py and passed as --tool-config-file.
experimental = ["wrapper-scripts"]

[scripts.wrapper.lane-db]
command = { command-line = '../scripts/nextest-db-wrapper.sh', relative-to = 'workspace-root' }

[profile.lane]
fail-fast = false
retries = 0
# The lane scrapes skip markers (`*-SKIP (reason=`) from the log, so passing tests
# must print their output too.
success-output = "immediate"
failure-output = "immediate-final"
status-level = "pass"
final-status-level = "fail"
# Hard ceiling per test (cargo test had none); a hung test fails instead of stalling CI.
slow-timeout = { period = "300s", terminate-after = 12, grace-period = "30s" }

[[profile.lane.scripts]]
filter = 'all()'
run-wrapper = 'lane-db'

[profile.lane.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
