[package]
name = "setjoin-mailctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mailctl"
path = "src/main.rs"

[dependencies]
setjoin-backup = { path = "../../crates/backup" }
setjoin-schema = { path = "../../crates/schema" }
setjoin-push = { path = "../../crates/push" }
x509-parser = "=0.18.1"
num-bigint = "=0.4.6"
url = "=2.5.8"
sm3 = "=0.4.2"
pbkdf2 = "=0.12.2"
base64 = "=0.22.1"
zeroize = "=1.9.1"
mailparse = "=0.16.1"
rpassword = "=7.4.0"
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
bcrypt = "=0.17.1"
ring = "=0.17.14"
chrono = "=0.4.45"
setjoin-pg = { path = "../../crates/pg" }
tokio = { version = "1.54", features = ["rt", "net", "time", "process"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
csv = "=1.4.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
libc = "=0.2.191"
sha2 = "=0.10.9"

[dev-dependencies]
setjoin-push = { path = "../../crates/push", features = ["oracle-loopback"] }
