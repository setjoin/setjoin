[package]
name = "setjoin-asrbot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "setjoin_asrbot"
path = "src/lib.rs"

[[bin]]
name = "asrbotd"
path = "src/main.rs"

# Exact pins like the gateway: the sidecar is protocol plumbing, reviewed with Cargo.lock.
[dependencies]
webrtc = "=0.21.1"
rtc = "=0.21.1"
livekit-protocol = "=0.8.2"
unsafe-libopus = "=0.2.0"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
hyper = { version = "=1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server", "http1"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.145" }
subtle = "=2.6.1"
futures-util = "=0.3.34"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "=0.8.5"
tokio-util = { version = "=0.7.20", default-features = false }
async-trait = "=0.1.92"
prost = "=0.14.4"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util", "process"] }
libc = "=0.2.191"
