[package]
name = "setjoin-sql-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "verify-sql-contracts"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
setjoin-approvals = { path = "../../crates/domains/approvals" }
setjoin-blobs = { path = "../../crates/domains/blobs" }
setjoin-calendar = { path = "../../crates/domains/calendar" }
setjoin-pg = { path = "../../crates/pg" }
setjoin-rules = { path = "../../crates/domains/rules" }
setjoin-sql-catalog = { path = "../../crates/sql-catalog" }
setjoin-user-settings = { path = "../../crates/domains/user-settings" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7.18"
