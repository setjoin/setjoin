# nextest profile for the server-rust parallel full lane (#550); see
# docs/guides/VERIFICATION_COMMANDS.md and server/AGENTS.md.
#
# Only the `lane` profile exists: plain `cargo test` stays the serial reference lane.
# DB-backed tests run in their own process through the DB wrapper, which clones a private
# database from the schema-loaded template (nothing here weakens a test); pure in-memory
# unit tests run unwrapped and fail closed via `leak_guard` if they ever touch Postgres. The serial
# groups (docker, fixed ports, /dev/shm) are generated by
# scripts/ci/server-rust-lane-groups.py and passed as --tool-config-file.
experimental = ["wrapper-scripts"]

[scripts.wrapper.lane-db]
command = { command-line = '../scripts/nextest-db-wrapper.sh', relative-to = 'workspace-root' }

[profile.lane]
fail-fast = false
retries = 0
# The lane scrapes skip markers (`*-SKIP (reason=`) from the log, so passing tests
# must print their output too.
success-output = "immediate"
failure-output = "immediate-final"
status-level = "pass"
final-status-level = "fail"
# Hard ceiling per test (cargo test had none); a hung test fails instead of stalling CI.
slow-timeout = { period = "300s", terminate-after = 12, grace-period = "30s" }

[[profile.lane.scripts]]
# Pure in-memory src/ unit tests do not need a cloned Postgres DB (leak_guard
# keeps ALLOW_CONNECTIONS false on the base DB so any new src/ test that touches
# Postgres fails closed immediately). Wrap all integration tests (`kind(test)`)
# plus the exact 10 src/ unit tests that connect to Postgres.
filter = '''
  kind(test)
  | (binary_id(=setjoin-threat) & test(=gate::tests::http_without_username_still_checks_the_ip_lock))
  | (binary_id(=setjoin-auth) & test(=policy_composition::tests::auth_policy_runtime_boots_and_runs_private_pre_auth_read))
  | (binary_id(=setjoin-gateway) & (
      test(=jmap::family::seam::account::db::resolve_matches_parse_account_id)
      | test(=jmap::family::seam::call::db::actor_arguments_are_seam_bound)
      | test(=jmap::family::seam::call::db::scoped_queries_bind_the_session_actor)
      | test(=jmap::family::seam::call::db::rsvp_on_behalf_requires_a_calendar_grant)
      | test(=jmap::imip::db::the_sender_is_the_caller_or_a_send_as_grant)
      | test(=jmap::imip::db::egress_enqueues_only_checked_mail)
      | test(=jmap::imip::db::egress_drops_only_the_invalid_recipient)
      | test(=policy_composition::tests::gateway_policy_runtime_boots_listens_and_mints_all_capability_txs)
    ))
'''
run-wrapper = 'lane-db'

[profile.lane.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true
