[package]
name = "setjoind"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autobins = false
autotests = false

[lib]
name = "setjoind"
path = "src/lib.rs"

[[bin]]
name = "setjoind"
path = "src/main.rs"

[[bin]]
name = "setjoin-server-shim"
path = "src/bin/setjoin-server-shim.rs"

[[bin]]
name = "setjoin-auth-shim"
path = "src/bin/setjoin-auth-shim.rs"

[dependencies]
setjoin-auth = { path = "../auth", features = ["in-process-authority"] }
setjoin-authz = { path = "../../crates/authz" }
setjoin-boot = { path = "../../crates/boot" }
setjoin-config-secret = { path = "../../crates/config-secret" }
setjoin-gateway = { path = "../gateway" }
setjoin-identity = { path = "../../crates/domains/identity", features = ["in-process-authority"] }
setjoin-pg = { path = "../../crates/pg", features = ["mint", "worker-pool"] }
setjoin-schema = { path = "../../crates/schema" }
setjoin-threat = { path = "../../crates/threat" }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "=0.7.20", default-features = false }
serde_json = "=1.0.145"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
bcrypt = "=0.17.1"
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
libc = "=0.2.191"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
serde = "=1.0.229"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
setjoin-conformance = { path = "../../tests/conformance" }
setjoin-edge-contract = { path = "../../crates/edge-contract" }
setjoin-mail-security = { path = "../../crates/domains/mail-security" }
tempfile = "=3.27.0"
tokio-postgres = "=0.7.18"

[[test]]
name = "suite_misc"
path = "tests/suite_misc.rs"
