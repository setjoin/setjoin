[package]
name = "setjoin-authz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[features]
oracle-mutants = ["setjoin-contracts/oracle-mutants"]

[dependencies]
maxminddb = "=0.32.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

setjoin-contracts = { path = "../contracts" }
mailparse = "=0.16.1"
icu_casemap = "=2.4.0"
bcrypt = "=0.17.1"
pbkdf2 = "=0.12.2"
sm3 = "=0.4.2"
subtle = "=2.6.1"
setjoin-pg = { path = "../pg", features = ["mint"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
ring = "=0.17.14"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
serde_json = "=1.0.145"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
hmac = "=0.12.1"
sha2 = "=0.10.9"

zeroize = "=1.9.1"
sm2 = { version = "=0.14.0", default-features = false, features = ["dsa", "pkcs8", "pem", "std"] }

setjoin-config-secret = { path = "../config-secret" }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "std"] }

chrono-tz = "=0.10.4"
ipnet = "=2.12.2"
libc = "=0.2.191"

[dev-dependencies]
aes = "=0.8.4"
futures-util = "=0.3.34"
setjoin-conformance = { path = "../../tests/conformance" }
sha1 = "=0.10.7"
tempfile = "=3.27.0"

[[test]]
name = "suite_misc"
path = "tests/suite_misc.rs"
