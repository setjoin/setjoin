openapi: 3.1.0
info:
  title: Setjoin Edge API
  description: Canonical schema-first HTTP edge contract for Setjoin non-JMAP/non-DAV APIs (OpenAPI 3.1).
  version: 0.0.0
tags:
  - name: Health
  - name: Rules
  - name: Delivery
  - name: Offline
paths:
  /_gateway/healthz:
    get:
      operationId: HealthOperations_getGatewayHealthz
      summary: Gateway-local liveness probe
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            text/plain:
              schema:
                type: string
      tags:
        - Health
  /api/messages/{emailId}/trace:
    get:
      operationId: DeliveryOperations_getMessageTrace
      summary: Fetch inbound hop trace or outbound delivery status for an owned message
      parameters:
        - name: emailId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[+-]?[0-9]+$
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery.MessageTrace'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
            text/plain:
              schema:
                type: string
        '429':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '503':
          description: Service unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
      tags:
        - Delivery
  /api/offline/size-estimate:
    get:
      operationId: OfflineOperations_getOfflineSizeEstimate
      summary: Estimate local storage size across offline mail cache windows
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offline.OfflineSizeEstimate'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '429':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
