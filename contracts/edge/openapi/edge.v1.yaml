      type: object
      required:
        - id
        - name
        - status
        - reviewed
        - total
        - createdBy
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          $ref: '#/components/schemas/Admin.AccessReviewStatus'
        reviewed:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        createdBy:
          type: string
        createdAt:
          type: string
        closedBy:
          anyOf:
            - type: string
            - type: 'null'
        closedAt:
          anyOf:
            - type: string
            - type: 'null'
