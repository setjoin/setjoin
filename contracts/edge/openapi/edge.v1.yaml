components:
  schemas:
    Common.CursorPageMeta:
      type: object
      required:
        - hasMore
      properties:
        nextCursor:
          anyOf:
            - type: string
            - type: 'null'
          description: Cursor to fetch the next page, or null when exhausted.
        hasMore:
          type: boolean
          description: True when additional pages follow.
      description: Shared cursor pagination envelope metadata.
    Common.CursorPaginationQuery:
      type: object
      properties:
        cursor:
          type: string
          description: Opaque cursor returned by the previous page.
        limit:
          type: integer
          format: int32
          description: Maximum number of items to return.
      description: Shared cursor-based pagination query parameters.
    Common.OffsetPaginationQuery:
      type: object
      properties:
        limit:
          type: integer
          format: int32
          description: Maximum number of items to return.
        offset:
          type: integer
          format: int32
          description: Zero-based item offset.
      description: Shared offset-based pagination query parameters.
    Common.ProblemDetails:
      type: object
      required:
        - status
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
        title:
          type: string
          description: Short human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code generated by the origin server.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence of the problem.
        code:
          type: string
          description: Machine-readable Setjoin error code (e.g., dpop_admission, BZ121).
        instance:
          type: string
          description: URI reference identifying the specific occurrence of the problem.
        remediation:
          type: string
          description: Optional remediation hint or action key.
        remediation_tou_id:
          type: integer
          format: int64
          description: Optional Terms of Use identifier when remediation is 'terms'.
        retryable:
          type: boolean
          description: Whether the client may safely retry the operation.
        holderId:
          type: integer
          format: int64
          description: Optional lock holder identifier for conflict responses.
      description: RFC 9457 Problem Details payload returned by Setjoin HTTP edge handlers.
    Delivery.DeliveryAttempt:
      type: object
      required:
        - 'n'
        - at
        - mxHost
        - smtpCode
        - smtpText
        - outcome
        - tls
      properties:
        'n':
          type: integer
          format: int32
        at:
          anyOf:
            - type: string
            - type: 'null'
        mxHost:
          anyOf:
            - type: string
            - type: 'null'
        smtpCode:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
        smtpText:
          anyOf:
            - type: string
            - type: 'null'
        outcome:
          type: string
        tls:
          type: boolean
      description: One append-only outbound SMTP delivery attempt.
    Delivery.DeliveryRecipient:
      type: object
      required:
        - email
        - status
        - mxHost
        - deliveredAt
        - nextAttemptAt
        - lastSmtpCode
        - lastSmtpText
        - attempts
      properties:
        email:
          type: string
        status:
          $ref: '#/components/schemas/Delivery.RecipientStatus'
        mxHost:
          anyOf:
            - type: string
            - type: 'null'
        deliveredAt:
          anyOf:
            - type: string
            - type: 'null'
        nextAttemptAt:
          anyOf:
            - type: string
            - type: 'null'
        lastSmtpCode:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
        lastSmtpText:
          anyOf:
            - type: string
            - type: 'null'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/Delivery.DeliveryAttempt'
      description: Latest per-recipient outbound delivery state.
    Delivery.InboundDeliveryTrace:
      type: object
      required:
        - direction
        - hopCount
        - totalTransitMs
        - slowestHopIndex
        - hops
      properties:
        direction:
          $ref: '#/components/schemas/Delivery.InboundDirection'
        hopCount:
          type: integer
          format: int32
        totalTransitMs:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
        slowestHopIndex:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
        hops:
          type: array
          items:
            $ref: '#/components/schemas/Delivery.TraceHop'
        truncated:
          type: boolean
        auth:
          $ref: '#/components/schemas/Delivery.TraceAuthResults'
        raw:
          $ref: '#/components/schemas/Delivery.RawMessageRef'
      description: Inbound message trace containing parsed Received header hops.
    Delivery.InboundDirection:
      type: string
      enum:
        - inbound
      description: Inbound direction discriminator.
    Delivery.MessageTrace:
      anyOf:
        - $ref: '#/components/schemas/Delivery.InboundDeliveryTrace'
        - $ref: '#/components/schemas/Delivery.OutboundDeliveryTrace'
      description: Discriminated inbound hop trace or outbound per-recipient delivery trace for an owned message.
    Delivery.OutboundDeliveryTrace:
      type: object
      required:
        - direction
        - overallStatus
        - recipients
      properties:
        direction:
          $ref: '#/components/schemas/Delivery.OutboundDirection'
        auth:
          $ref: '#/components/schemas/Delivery.TraceAuthResults'
        raw:
          $ref: '#/components/schemas/Delivery.RawMessageRef'
        overallStatus:
          type: string
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/Delivery.DeliveryRecipient'
      description: Outbound message trace containing per-recipient SMTP delivery state.
    Delivery.OutboundDirection:
      type: string
      enum:
        - outbound
      description: Outbound direction discriminator.
    Delivery.RawMessageRef:
      type: object
      required:
        - url
        - sizeBytes
      properties:
        url:
          type: string
        sizeBytes:
          type: integer
          format: int64
      description: Reference to the raw RFC 5322 message download.
    Delivery.RecipientStatus:
      type: string
      enum:
        - delivered
        - deferred
        - bounced
        - queued
      description: Latest per-recipient outbound delivery status.
    Delivery.TraceAuthResult:
      type: object
      required:
        - result
      properties:
        result:
          type: string
        domain:
          type: string
        evidence:
          type: string
      description: Authentication mechanism verification outcome.
    Delivery.TraceAuthResults:
      type: object
      properties:
        spf:
          $ref: '#/components/schemas/Delivery.TraceAuthResult'
        dkim:
          $ref: '#/components/schemas/Delivery.TraceAuthResult'
        dmarc:
          $ref: '#/components/schemas/Delivery.TraceAuthResult'
        arc:
          $ref: '#/components/schemas/Delivery.TraceAuthResult'
      description: Aggregate SPF/DKIM/DMARC/ARC verification outcomes.
    Delivery.TraceDirection:
      type: string
      enum:
        - inbound
        - outbound
      description: Direction of a traced message.
    Delivery.TraceHop:
      type: object
      required:
        - index
        - timestamp
        - delayMs
        - tlsActive
        - isOurInfra
        - parseOk
      properties:
        index:
          type: integer
          format: int32
        fromHost:
          type: string
        byHost:
          type: string
        withProtocol:
          type: string
        ip:
          type: string
        rdns:
          type: string
        timestamp:
          anyOf:
            - type: string
            - type: 'null'
        delayMs:
          anyOf:
            - type: integer
