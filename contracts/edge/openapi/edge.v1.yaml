      tags:
        - Rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rules.RuleInput'
  /api/settings/rules-list:
    get:
      operationId: RulesOperations_listRules
      summary: List personal mail rules for the authenticated user
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
