components:
  schemas:
    Admin.AccessReviewBulkDecideRequest:
      type: object
      required:
        - itemIds
        - decision
      properties:
        itemIds:
          type: array
          items:
            type: integer
            format: int64
        decision:
          $ref: '#/components/schemas/Admin.AccessReviewWriteDecision'
