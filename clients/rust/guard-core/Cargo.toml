[package]
name = "guard-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "guard_core"

[dependencies]
totp-rs    = { version = "5", features = ["otpauth", "qr"] }
p256       = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8"] }
aes-gcm    = "0.11"
argon2     = "0.5"
rusqlite   = { version = "0.40", features = ["bundled"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi     = "0.32"
uuid       = { version = "1", features = ["v4"] }
rand       = "0.10"
thiserror  = "2"
base64     = "0.23"
zeroize    = { version = "1", features = ["derive"] }
hkdf       = "0.13"
sha2       = "0.11"
hex        = "0.4"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
# F10 spike (iOS): raw CF FFI SecureStore backend (Secure Enclave) — securestore/ios.rs.
# F13/P2 (macOS): higher-level security-framework SecureStore backend — securestore/macos.rs.
# Host (Linux/Windows/Android) build never sees these (cfg-gated dependency
# section). `OSX_10_15` unlocks `Location::DataProtectionKeychain` (macOS only
# — inert on iOS, which is always DataProtectionKeychain regardless of the
# feature flag; see security-framework-sys's item.rs cfg).
core-foundation     = "0.10"
core-foundation-sys = "0.8"
security-framework  = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = "2"

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[dev-dependencies]
tempfile = "3"
