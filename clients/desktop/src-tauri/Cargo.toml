[package]
name = "setjoin-desktop"
version = "0.1.0"
edition = "2021"
publish = false

# Tauri 2 mobile builds the app as a library (cdylib for Android JNI,
# staticlib for the iOS Xcode "Build Rust Code" phase); main.rs stays a thin
# binary wrapper around lib.rs::run() so desktop is unaffected. Without this,
# `tauri android/ios build` fails looking for a libsetjoin_desktop.so/.a that
# a bin-only crate never produces (the real cause of the C2 mobile-build gap,
# distinct from the NDK ranlib fix in ../../.cargo/config.toml).
[lib]
name = "setjoin_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
capability-session = { path = "../../rust/capability-session" }
guard-core = { path = "../../rust/guard-core" }
offline-core = { path = "../../rust/offline-core" }
# MAM device-trust lifecycle (mam.rs): HTTP checkin + per-device HMAC proof.
# reqwest's rustls already resolves in the tree via tauri's updater plugin.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# C2 cfg(mobile) — target-checked post-init: mobile-only plugins (biometric +
# native share). These compile only for iOS/Android; the orchestrator
# compile-checks them after `tauri ios/android init`. Desktop never links them.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-biometric = "2"
tauri-plugin-share = "2"

[target.'cfg(target_os = "android")'.dependencies]
# DESKTOP-007 FLAG_SECURE JNI bridge (mam_android.rs). Must stay on 0.21: wry,
# tauri and tao resolve to jni 0.21, and the JNIEnv handed to `dispatch`
# closures must be the same type this crate links against.
jni = "0.21"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Queue B #6 mobile-runtime e2e harness: gates a self-driving probe (vault
# unlock -> db open/exec/query/wipe round trip) that writes its result to the
# app data dir. OFF by default — never in a shipped build; the harness
# (clients/desktop/scripts/mobile-e2e.sh) builds with this feature enabled.
mobile-e2e-probe = []
