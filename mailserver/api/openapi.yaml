        Auth: `requireAuth` only (actor = `claims.UserID`, never from request body —
        DATABASE_SECURITY R2). All queries run inside `RunUserScoped`, which sets
        `app.current_user_id` → FORCE RLS on `approval_requests`.
      responses:
        "200":
          description: >-
            The caller's approvals, split into two lists: requests awaiting the
            caller's decision (`pendingForMe`) and requests the caller submitted
            (`myRequests`). Each is an array of the same approval-request item.
          content:
            application/json:
              schema:
                type: object
                required: [pendingForMe, myRequests]
                properties:
                  pendingForMe: { type: array, items: { $ref: "#/components/schemas/ApprovalRequestItem" } }
                  myRequests:   { type: array, items: { $ref: "#/components/schemas/ApprovalRequestItem" } }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/me/approvals/{id}/decide:
    x-visibility: public
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    post:
      tags: [approvals]
      summary: Approve or deny a pending approval request
      description: |
        Calls the consumer-specific `*_approval_decide` reducer (`rbac_approval_decide`,
        `mail_external_approval_decide`, or `group_moderation_approval_decide`) and
        resolves the downstream action. Auth: `requireAuth` only (actor =
        `claims.UserID`, never from the request body). RLS gate: only the designated
        approver can see + decide the request — a stranger gets opaque 404 (RLS returns
        0 rows, no BZ exposed); a requester who can see the row but is not the approver
        gets BZ107 → 403. BZ106 → 400 (request not pending). BZ108 → 400 (invalid
        decision value). BZ109 → 403 (self-approval not allowed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, deny] }
                comment:  { type: string, nullable: true }
                capabilities:
                  type: array
                  minItems: 1
                  maxItems: 12
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/DriveCapability" }
                  description: Drive-access approvals only; must be a subset of the request.
                propagation: { type: string, enum: [self, children, subtree], description: Drive-access approvals only; may only narrow the request. }
                expiresAt: { type: string, format: date-time, description: Drive-access approvals only; may not exceed the requested expiry. }
                maxUses: { type: integer, minimum: 1, maximum: 1000000, description: Drive-access approvals only; may not exceed the requested bound. }
                expectedEpoch: { type: string, pattern: "^(0|[1-9][0-9]*)$", description: Required when approving a Drive-access request; this is the immutable request-time epoch and stale epochs fail closed. }
      responses:
        "204":
          description: Decision recorded and downstream action resolved
        "400":
          description: |
            `BZ106` — request is not pending (already decided or expired).
            `BZ108` — decision value is not `approve` or `deny`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: |
            `BZ107` — caller is not the designated approver for this request.
            `BZ109` — caller is the requester (self-approval not allowed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Request not found (or RLS opaque-404 for a stranger probe)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /approvals/email/{token}:
    x-visibility: public
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
        description: HMAC-SHA256 signed JWT (signed with `JWT_SECRET`, 7-day TTL) encoding the request id and designated approver user id.
    get:
      tags: [approvals]
      summary: Render the approve-by-email decision page
      description: |
        Returns a self-contained HTML page with Approve and Deny buttons. No session
        cookie or Bearer token required — access is gated by the HMAC-signed `{token}`
        in the path. The server verifies the token and checks the request is still
        pending before rendering. BZ106 → 410 Gone (request no longer pending). An
        invalid or expired token → 401.
      security: []
      responses:
        "200":
          description: HTML approve-by-email decision page (self-contained, no SPA dependency)
          content:
            text/html:
              schema: { type: string }
        "401":
          description: Token missing, invalid, or expired
        "410":
          description: Request is no longer pending (already decided or expired — BZ106)
    post:
      tags: [approvals]
      summary: Submit an approve-by-email decision
      description: |
        Accepts `application/x-www-form-urlencoded` body with `decision=approve|deny`
        and an optional `comment`. Verifies the same HMAC token, calls the
        consumer-specific decide reducer, and returns a plain-HTML confirmation page.
        No session required. BZ107 → 403 (not the designated approver). BZ109 → 403
        (self-approval not allowed).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, deny] }
                comment:  { type: string }
      responses:
        "200":
          description: HTML confirmation page (decision recorded)
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Missing or invalid decision field
        "401":
          description: Token missing, invalid, or expired
        "403":
          description: |
            `BZ107` — caller is not the designated approver.
            `BZ109` — self-approval not allowed.
        "410":
          description: Request is no longer pending (BZ106)

  /api/admin/approval-policies:
    x-visibility: admin
    get:
      tags: [admin-approvals]
      summary: List approval policies
      description: |
        Returns all `approval_policies` rows, optionally filtered by `consumer_type`.
        Requires `approvals.view` or `approvals.manage`. All queries run inside
        `RunUserScoped` (FORCE RLS on `approval_policies`).
      parameters:
        - name: consumer_type
          in: query
          required: false
          schema:
            type: string
            enum: [rbac.jit_activation, mail.external_send, mail.group_moderation]
          description: Filter by consumer type. Omit to return all.
      responses:
        "200":
          description: Array of approval policy objects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:               { type: integer, format: int64 }
                    consumerType:     { type: string }
                    name:             { type: string }
                    enabled:          { type: boolean }
                    priority:         { type: integer }
                    conditions:       { type: object, additionalProperties: true }
                    requiresApproval: { type: boolean }
                    approverSpec:     { type: object, additionalProperties: true }
                    createdAt:        { type: string, format: date-time }
                    updatedAt:        { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin-approvals]
      summary: Create an approval policy
      description: |
        Creates a new `approval_policies` row. Priority is auto-assigned as
        `max(priority for this consumer_type) + 1`. Requires `approvals.manage`.
        An audit row is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consumerType, name, conditions, approverSpec]
              properties:
                consumerType:     { type: string, enum: [rbac.jit_activation, mail.external_send, mail.group_moderation] }
                name:             { type: string }
                enabled:          { type: boolean, default: false }
                conditions:       { type: object, additionalProperties: true, description: "Consumer-specific match conditions (JSON object)" }
                requiresApproval: { type: boolean, default: true }
                approverSpec:     { type: object, additionalProperties: true, description: "Who must approve — user id, role group id, or moderator list (JSON object)" }
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
        "400":
          description: Invalid JSON, missing required field, or invalid consumerType
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/approval-policies/{id}:
    x-visibility: admin
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    put:
      tags: [admin-approvals]
      summary: Update an approval policy (partial)
      description: |
        Partial-update (`COALESCE`): only fields present in the body are changed.
        `consumerType` and `priority` are not patchable via this endpoint (use
        `/reorder` for priority). Requires `approvals.manage`. Audit row written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:             { type: string, nullable: true }
                enabled:          { type: boolean, nullable: true }
                conditions:       { type: object, additionalProperties: true, nullable: true }
                requiresApproval: { type: boolean, nullable: true }
                approverSpec:     { type: object, additionalProperties: true, nullable: true }
      responses:
        "204": { description: Policy updated }
        "400": { description: "Invalid JSON, or conditions/approverSpec is not a JSON object" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin-approvals]
      summary: Delete an approval policy
      description: |
        Hard-deletes the policy. Fails with 409 if existing `approval_requests` rows
        reference this policy (FK constraint). Requires `approvals.manage`. Audit row
        written.
      responses:
        "204": { description: Policy deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Policy is referenced by existing approval requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/admin/approval-policies/reorder:
    x-visibility: admin
    post:
      tags: [admin-approvals]
      summary: Reorder approval policies within a consumer type
      description: |
        Renumbers priorities 1..N in the supplied order within `consumerType`. Uses a
        two-pass (negative then positive) strategy to avoid UNIQUE constraint
        violations mid-renumber. Requires `approvals.manage`. Audit row written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consumerType, orderedIds]
              properties:
                consumerType: { type: string, enum: [rbac.jit_activation, mail.external_send, mail.group_moderation] }
                orderedIds:   { type: array, items: { type: integer, format: int64 } }
      responses:
        "204": { description: Priorities updated }
        "400": { description: Invalid consumerType or malformed JSON }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Priority conflict during reorder — retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

