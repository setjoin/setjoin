  /api/me/sharing:
    x-visibility: public
    get:
      tags: [sharing]
      summary: Who-can-see panel data (delegates, calendar grantees, defaults)
      description: |
        The end-user sharing overview (spec 2026-06-27-sharing-delegation-design.md §6-C):
        the caller's mailbox delegates, explicit calendar grantees, their own
        user-scope `sharing_defaults` rows, the inherited org/OU/group defaults
        that apply to them as an owner, and whether the `sharing.defaults`
        toggle is on. Auth: `requireAuth`; every query is scoped to the caller
        server-side (R1).
      responses:
        "200":
          description: Sharing overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  delegates:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:     { type: integer, format: int64 }
                        email:      { type: string }
                        name:       { type: string }
                        permission: { type: string, enum: [read, send_as, send_on_behalf, full_access, manage_calendar] }
                        grantedAt:  { type: string }
                  calendarGrants:
                    type: array
                    items:
                      type: object
                      properties:
                        calendarId:   { type: integer, format: int64 }
                        calendarName: { type: string }
                        userEmail:    { type: string }
                        userName:     { type: string }
                        level:        { type: string, enum: [freebusy, read, write, admin] }
                  myDefaults:
                    type: array
                    items: { $ref: "#/components/schemas/SharingDefaultRow" }
                  inheritedDefaults:
                    type: array
                    items: { $ref: "#/components/schemas/SharingDefaultRow" }
                  defaultsEnabled: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/me/sharing/delegates:
    x-visibility: public
    post:
      tags: [sharing]
      summary: Grant a mailbox delegate on the caller's primary mailbox
      description: |
        Calls `mailbox_delegate_grant` (owner-only; ownership rides in the
        INSERT's own WHERE — BZ114 on a non-owner, 404-indistinguishable;
        BZ115 on an invalid permission level). The mailbox is always the
        caller's primary mailbox (R2 — never client-chosen).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granteeEmail, permission]
              properties:
                granteeEmail: { type: string }
                permission:   { type: string, enum: [read, send_as, send_on_behalf, full_access, manage_calendar] }
      responses:
        "201": { description: Delegate granted }
        "400": { description: Invalid permission level (BZ115) }
        "404": { description: Grantee not found (BZ114) }

  /api/me/sharing/delegates/{userId}:
    x-visibility: public
    delete:
      tags: [sharing]
      summary: Revoke a delegate (all permission rows) from the caller's primary mailbox
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Revoked (idempotent for the owner) }
        "404": { description: Mailbox not owned (BZ114) }

  /api/me/sharing/default:
    x-visibility: public
    put:
      tags: [sharing]
      summary: Upsert the caller's own user-scope calendar default
      description: |
        Calls `sharing_default_set` with `owner_scope='user'`, `owner_ref` =
        the caller (forced server-side, R2). `audienceRef` defaults to the
        caller's domain for `audience=everyone` (D7). Rows are inert until the
        `sharing.defaults` toggle is on (D11).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience, level]
              properties:
                audience:    { type: string, enum: [everyone, ou, group] }
                audienceRef: { type: integer, format: int64 }
                level:       { type: string, enum: [none, freebusy, read] }
      responses:
        "200":
          description: Upserted row id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
        "400": { description: Invalid audience/level or unknown ref (BZ117) }

  /api/me/sharing/default/{id}:
    x-visibility: public
    delete:
      tags: [sharing]
      summary: Clear one of the caller's own user-scope defaults
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Cleared }
        "403": { description: Not the owner of the row (BZ116) }
        "404": { description: Row not found (BZ114) }

  /api/admin/sharing/defaults:
    x-visibility: admin
    get:
      tags: [admin-sharing]
      summary: List sharing-default rules (labels resolved)
      description: |
        Returns `sharing_defaults` rows with human labels for owner-scope
        target and audience. Requires `sharing.read` or `sharing.manage`.
        Domain-scoped admins see their domain's org/group/user rows (D7); OU
        rows carry no domain axis and are always listed.
      responses:
        "200":
          description: Array of sharing-default rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SharingDefaultAdminRow" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin-sharing]
      summary: Create or update a sharing-default rule (upsert)
      description: |
        Calls `sharing_default_set` (actor = `claims.UserID`). Requires
        `sharing.manage` + a change reason (requireReason). The reducer
        re-enforces the auth ladder + D7 domain scoping (BZ116) and validates
        the scope/audience/level combination (BZ117). Audit is written by the
        reducer (`audit_write` tier core, D8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerScope, ownerRef, audience, audienceRef, level]
              properties:
                ownerScope:  { type: string, enum: [org, ou, group, user] }
                ownerRef:    { type: integer, format: int64 }
                audience:    { type: string, enum: [everyone, ou, group] }
                audienceRef: { type: integer, format: int64 }
                level:       { type: string, enum: [none, freebusy, read] }
      responses:
        "200":
          description: Upserted row id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
        "400": { description: Invalid combination or unknown ref (BZ117) }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/sharing/defaults/{id}:
    x-visibility: admin
    delete:
      tags: [admin-sharing]
      summary: Delete a sharing-default rule
      description: |
        Calls `sharing_default_clear`. Requires `sharing.manage` + a change
        reason; the reducer re-enforces the ladder + domain scope (BZ116).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
