                    wopiPublicBaseUrl: { type: string, format: uri, description: HTTPS public Setjoin base used to reconstruct the signed callback URL }
                    editorUrl: { type: string, format: uri, description: HTTPS Collabora editor launch URL }
                    profile: { type: string, enum: [existing-provider, managed-wildcard, managed-customer-cert, managed-customer-proxy] }
