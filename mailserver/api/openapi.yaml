                    properties:
                      total: { type: integer, format: int64, minimum: 0 }
                      breakGlass: { type: integer, format: int64, minimum: 0 }
                      sensitiveRoleHolders: { type: integer, format: int64, minimum: 0 }
                  entitlementAmbiguity:
                    type: object
                    additionalProperties: false
                    required: [distributionGroupMemberships, adminRoleAssignments]
                    properties:
