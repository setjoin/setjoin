  /api/mail/attachment-transfer-token:
    x-visibility: public
    post:
      tags: [jmap]
      summary: Mint an exact native mail-attachment transfer token
      description: |
        Mints a non-renewable five-minute bearer for one immutable attachment.
        The server derives device and session authority from authentication and
        rechecks live feature, policy, device, session-family, and attachment
        ownership authority on every subsequent Range request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, sha256]
              properties:
                accountId: { type: string, pattern: "^[1-9][0-9]*$" }
                sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: Exact one-blob transfer credential and immutable metadata
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token, expiresAt, path, sha256, size, etag]
                properties:
                  token: { type: string, description: Send only as an Authorization Bearer; never persist or log it. }
                  expiresAt: { type: string, format: date-time }
                  path: { type: string, pattern: "^/mail-attachment/[0-9a-f]{64}$" }
                  sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                  size: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
                  etag: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Feature disabled or attachment unavailable }
        "503": { description: Transfer minting unavailable }

  /mail-attachment/{sha256}:
    x-visibility: public
    parameters:
      - { name: sha256, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    get:
      tags: [jmap]
      summary: Stream one authorized immutable attachment with resumable ranges
      parameters:
        - { name: Range, in: header, schema: { type: string }, example: bytes=1048576-2097151 }
        - { name: If-Range, in: header, schema: { type: string }, description: Exact strong SHA-256 ETag returned by the mint response. }
      responses:
        "200":
          description: Complete identity-coded attachment body
          headers:
            ETag: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "206":
          description: Exact identity-coded byte range
          headers:
            Content-Range: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Authorized attachment no longer exists or is no longer owned }
        "409": { description: Feature or effective-policy generation changed; preserve the partial and re-evaluate before reminting. }
        "416": { description: Requested byte range is outside the immutable representation }
        "503": { description: Attachment storage unavailable }

  /jmap/recovery-raw/{accountId}/{messageId}:
    x-visibility: public
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, pattern: "^[1-9][0-9]*$" } }
      - { name: messageId, in: path, required: true, schema: { type: string, pattern: "^[1-9][0-9]*$" } }
    get:
