  /api/admin/audit/policy:
    x-visibility: admin
    get:
      tags: [admin-audit]
      summary: Get the audit policy singleton (level + reason-required areas)
      description: |
        Returns the `audit_policy` singleton row. Requires `audit.read`
        (included in the logs console scope). The `level` field controls
        whether `routine`-tier audit rows are written (`full`) or suppressed
        (`lean`). `reasonRequiredAreas` lists the permission-area prefixes
        for which `RequireReason` enforces an `X-Audit-Reason` header.
      responses:
        "200":
          description: Current audit policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  level:
                    type: string
                    enum: [lean, full]
                  reasonRequiredAreas:
                    type: array
                    items: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin-audit]
      summary: Update the audit policy (level + reason-required areas)
      description: |
        Updates the `audit_policy` singleton. Requires `audit.export`.
        A non-empty `reason` field is mandatory (belt-and-suspenders beyond
        the `RequireReason` middleware). Writes a core `audit_policy_change`
        audit row (before/after diff) that is always committed regardless of
        the `level` setting. `level` must be `lean` or `full`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, reasonRequiredAreas, reason]
              properties:
                level:
                  type: string
                  enum: [lean, full]
                reasonRequiredAreas:
                  type: array
                  items: { type: string }
                reason:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Updated audit policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  level:
                    type: string
                    enum: [lean, full]
                  reasonRequiredAreas:
                    type: array
                    items: { type: string }
        "400": { description: "Missing reason, invalid level, or malformed JSON" }
        "403": { $ref: "#/components/responses/Forbidden" }

