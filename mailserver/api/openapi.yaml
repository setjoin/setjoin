        - { name: Range, in: header, schema: { type: string }, example: bytes=0-1048575 }
      responses:
        "200":
          description: Complete content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Single byte range
          content:
            application/octet-stream:
