      responses:
        "200":
          description: Updated global JIT defaults
          content:
            application/json:
              schema:
                type: object
                properties:
                  defaultMaxDurationMinutes:   { type: integer }
                  defaultRequireJustification: { type: boolean }
        "400": { description: "defaultMaxDurationMinutes must be positive, or invalid JSON" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/me/approvals:
    x-visibility: public
    get:
      tags: [approvals]
      summary: List the caller's approval requests (pending-for-me and submitted)
      description: |
        Returns all `approval_requests` where the caller is either the designated
