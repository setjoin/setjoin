                    type: object
                    additionalProperties: false
                    required: [total, enabled, disabled, guests, members, unclassifiedWithoutMailbox]
                    properties:
                      total: { type: integer, format: int64, minimum: 0 }
                      enabled: { type: integer, format: int64, minimum: 0 }
                      disabled: { type: integer, format: int64, minimum: 0 }
                      guests: { type: integer, format: int64, minimum: 0 }
                      members: { type: integer, format: int64, minimum: 0 }
                      unclassifiedWithoutMailbox: { type: integer, format: int64, minimum: 0 }
                  mailboxes:
                    type: object
                    additionalProperties: false
                    required: [shared, resources]
                    properties:
                      shared: { type: integer, format: int64, minimum: 0 }
                      resources: { type: integer, format: int64, minimum: 0 }
                  lifecycleSources:
                    type: object
                    additionalProperties:
                      type: integer
