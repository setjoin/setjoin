        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [drive]
      summary: Upload and register one content-addressed chunk
      description: Accepts 1–4 MiB. The body hash must equal the lowercase SHA-256 path value; authorization is rechecked before canonical promotion.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, minLength: 1, maxLength: 4194304 }
      responses:
        "201": { description: Chunk registered for the caller and space }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: Chunk exceeds 4 MiB }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

