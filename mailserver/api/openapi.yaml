openapi: 3.1.0
info:
  title: setjoin gateway API
  version: "1.0.0"
  description: |
    Integrator-facing REST surface of the setjoin on-premise mail server.

    SCOPE: this spec is the phased integrator and administrator contract. It
    includes auth, JMAP discovery, broad gateway coverage, and the complete
    exact-method Setjoin Drive surface; remaining debt is explicit in the ledger.
    Coverage is fenced by
    `scripts/check-openapi-coverage.sh`: every registered gateway route must be
    either documented here or listed in `mailserver/api/openapi-pending.txt`
    (the coverage-debt ledger), so a new route can never silently ship
    undocumented, and a documented path can never reference a dead route. The
    Much of the handler layer is still map/anonymous-struct dominated, so most
    contracts remain hand-authored while typed DTO generation expands — see
    `mailserver/api/AGENTS.md`.
  contact:
    name: setjoin
  x-logo:
    url: /api/logo.svg
    altText: setjoin
    backgroundColor: "#FFFFFF"
servers:
  - url: https://mail.example.com
    description: A setjoin gateway (replace with your host)
tags:
  - name: auth
    description: Authentication (proxied to the auth server)
  - name: jmap
    description: JMAP mail/calendar/contacts (RFC 8620/8621)
  - name: admin-users
    description: User administration
  - name: admin-domains
    description: Domain administration
  - name: admin-system
    description: System administration
  - name: scim
    description: SCIM 2.0 provisioning (RFC 7644)
  - name: discovery
    description: Unauthenticated client auto-discovery
  - name: admin-jit
    description: JIT (just-in-time) admin role activation — self-service and policy management
  - name: approvals
    description: Approval requests — user-facing decide and approve-by-email surfaces
  - name: admin-approvals
    description: Approval engine — policy management and audit read (admin)
  - name: drive
    description: Setjoin Drive spaces, members, nodes, content, collaboration, and compliance

security:
  - bearerAuth: []

paths:
  # x-visibility (admin|public) on each path object is DERIVED from the route's
  # auth wrapper in mailserver/cmd/mailserverd/main.go and machine-guarded by
  # scripts/check-openapi-visibility.sh so doc-visibility can never drift from
  # enforcement. A path wrapped in requireAdmin/requireSuperAdmin/requireRole(<admin
  # roles>) is `admin` (full spec only); anonymous, requireAuth, or SCIM-token
  # routes are `public` (an integrator can discover them before holding creds). The
  # anonymously-served spec (HandleYAML/HandleJSON/HandleDocs) DROPS every admin
  # path + strips these keys; the full spec (/api/openapi.full.yaml) is admin-gated.
  /api/discover:
    x-visibility: public
    get:
      tags: [discovery]
      summary: Client auto-discovery
      description: Returns connection settings for a domain. No auth required.
      security: []
      parameters:
        - name: domain
          in: query
          required: true
          schema: { type: string }
          example: example.com
      responses:
        "200":
          description: Discovery document
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /auth/login:
    x-visibility: public
    post:
      tags: [auth]
      summary: Log in
      description: |
        Proxied to the auth server. On success (200) returns a JWT access token
        (+ refresh token). If the account has MFA, returns 202 with an
        `mfa_token` challenge — complete `/auth/totp/*` or `/auth/push/*` first.
        A forced password change or required MFA enrollment returns 403.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated — access + refresh tokens issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "202":
          description: >-
            MFA challenge pending. The credentials were valid but a second factor
            is required; complete it with the returned `mfa_token` via
            `/auth/push/*` or `/auth/totp/*`. Push and TOTP-fallback both use this.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaChallenge" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: >-
            Access gated before tokens are issued — either an administrator
            requires a password change (`status` absent, `force_password_change:
            true` + `force_token`) or MFA enrollment is required
            (`status: mfa_enrollment_required`, `mfa_required: true` + `mfa_token`).
            NOTE: this is NOT an RFC 7807 Problem body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginGate" }

  /auth/refresh:
    x-visibility: public
    post:
      tags: [auth]
      summary: Refresh the access token
      description: Exchanges a valid refresh token for a new access token.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/logout:
    x-visibility: public
    post:
      tags: [auth]
      summary: Log out
      description: Revokes the current session/refresh token.
      responses:
        "200": { description: Logged out }

  /auth/me:
    x-visibility: public
    get:
      tags: [auth]
      summary: Current principal
      description: Returns the authenticated user's identity + roles.
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/session/token:
    x-visibility: public
    get:
      tags: [auth]
      summary: Reveal the presented access token (per-tab DPoP admission recovery)
      description: |
        Returns verbatim the access token the caller is already presenting
        (session cookie or Bearer). A freshly opened tab holds the shared
        session cookie and the persisted binding key but no token string, and
        a stale tab holds a string another tab's refresh already rotated away
        — both mint inadmissible DPoP proofs with no way back. This read
        self-authenticates through the admission-recovery funnel — everything
        the regular funnel enforces except the DPoP `ath` claim (a cnf-bound
        token still requires a proof bound to its `cnf.jkt`) — so the tab
        re-derives its `ath` source without minting or rotating anything and
        the other tabs' view of the session is untouched. Not behind
        requireAuth deliberately: requireAuth enforces the very `ath` claim a
        recovering tab cannot compute yet. Proxied through the gateway's
        rate-limited auth proxy.
      responses:
        "200":
          description: The presented access token, verbatim
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token:
                    type: string
                    description: The exact token string the caller presented.
        "401":
          description: >-
            Not authenticated — the recovery funnel rejected the presented
            token/proof.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: >-
            Wrong token type presented (e.g. a refresh token where an access
            token is required).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/oidc/link:
    x-visibility: public
    get:
      operationId: identityOIDCLinkBegin
      tags: [auth]
      summary: Begin linking an OIDC identity to the current person
      description: |
        Requires an authenticated session with AAL2 issued within five minutes.
        Starts a ten-minute, session-bound OIDC authorization flow. The callback
        links only the provider's exact issuer and subject; email never authorizes
        a link. This route does not activate an identity source or cutover flag.
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
          example: workforce
      responses:
        "302": { description: Redirect to the configured OIDC provider }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/saml/{idp}/link:
    x-visibility: public
    parameters:
      - name: idp
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 255 }
        example: workforce
    get:
      operationId: identitySAMLLinkBegin
      tags: [auth]
      summary: Begin linking a SAML identity to the current person
      description: |
        Requires an authenticated session with fresh AAL2. The encrypted flow
        cookie binds the current person, session digest, IdP registration, and
        expiry. The callback accepts only an exact IdP entity plus persistent
        NameID assertion.
      responses:
        "302": { description: Redirect to the configured SAML IdP }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/identity-links:
    x-visibility: public
    get:
      operationId: identityLinksListMine
      tags: [auth]
      summary: List the current person's authentication links
      description: |
        Returns at most eight link records and never returns an opaque external
        subject. Lifecycle/provisioning ownership is not exposed or changed here.
      responses:
        "200":
          description: Bounded authentication-link list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityAuthLinkList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Identity link service is unavailable }

  /auth/identity-links/{id}:
    x-visibility: public
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    delete:
      operationId: identityLinkDeleteMine
      tags: [auth]
      summary: Unlink one authentication-only federated identity
      description: |
        Requires fresh AAL2 and a bounded audit reason. The reducer refuses
        lifecycle/provisioning links and refuses removal of the final usable
        authentication or recovery route. A detached tombstone continues to
        reserve the source subject.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityAuthUnlinkRequest" }
            example: { reason: "Retired former workforce IdP" }
      responses:
        "200":
          description: Link detached and subscriber notice enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityAuthUnlinkResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /.well-known/openid-configuration:
    x-visibility: public
    get:
      tags: [auth]
      summary: OpenID Provider discovery metadata
      description: Proxies the local authorization server's OpenID Connect discovery document.
      security: []
      responses:
        "200":
          description: OpenID Provider metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcProviderMetadata" }

  /.well-known/oauth-authorization-server:
    x-visibility: public
    get:
      tags: [auth]
      summary: OAuth authorization-server metadata
      description: Proxies the local authorization server metadata defined by RFC 8414.
      security: []
      responses:
        "200":
          description: OAuth authorization-server metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcProviderMetadata" }

  /.well-known/jwks.json:
    x-visibility: public
    get:
      tags: [auth]
      summary: OpenID Provider JSON Web Key Set
      security: []
      responses:
        "200":
          description: Public signing keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JwkSet" }

  /keys:
    x-visibility: public
    get:
      tags: [auth]
      summary: Compatibility JSON Web Key Set endpoint
      description: Compatibility alias for clients configured with the provider's legacy key URL.
      security: []
      responses:
        "200":
          description: Public signing keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JwkSet" }

  /auth/password-policy:
    x-visibility: public
    get:
      tags: [auth]
      summary: Read the local password policy
      description: Returns the server-authoritative password rules used by pre-authenticated credential setup flows.
      security: []
      responses:
        "200":
          description: Current password policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordPolicy" }
        "429": { description: Too many attempts }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /auth/guest-invite/accept:
    x-visibility: public
    get:
      tags: [auth]
      summary: Inspect an external guest invitation
      description: Validates an unconsumed invitation and returns the disclosure that must be accepted.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Invitation disclosure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestInviteDisclosure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Too many attempts }
    post:
      tags: [auth]
      summary: Accept an external guest invitation
      description: Atomically consumes the single-use invitation, records disclosure acceptance, and activates the guest account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestInviteAcceptance" }
      responses:
        "200":
          description: Guest account activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestInviteAcceptanceResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Too many attempts }

  /.well-known/jmap:
    x-visibility: public
    get:
      tags: [jmap]
      summary: JMAP session
      description: |
        The JMAP capabilities + accounts document (RFC 8620 §2). The `accountId`
        used in every method call is
        `primaryAccounts["urn:ietf:params:jmap:mail"]`.
      responses:
        "200":
          description: Session object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JmapSession" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /jmap:
    x-visibility: public
    post:
      tags: [jmap]
      summary: JMAP API request
      description: |
        A JMAP request (RFC 8620 §3): a `using` array of capability URNs plus
        `methodCalls`. Returns `methodResponses`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JmapRequest" }
      responses:
        "200":
          description: JMAP response
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Malformed request / invalid method
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/admin/users:
    x-visibility: admin
    get:
      tags: [admin-users]
      summary: List users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin-users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64, description: The new user's id }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/users/{id}:
    x-visibility: admin
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    get:
      tags: [admin-users]
      summary: Get a user
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin-users]
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200": { description: Updated }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin-users]
      summary: Delete a user
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/users/{id}/password:
    x-visibility: admin
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    put:
      tags: [admin-users]
      summary: Reset a user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        "200": { description: Password reset }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/domains:
    x-visibility: admin
    get:
      tags: [admin-domains]
      summary: List domains
      responses:
        "200":
          description: Domains
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Domain" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin-domains]
      summary: Add a domain
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainCreate" }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/domains/{id}:
    x-visibility: admin
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    get:
      tags: [admin-domains]
      summary: Get a domain
      responses:
        "200":
          description: The domain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin-domains]
      summary: Update a domain
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Updated }
    delete:
      tags: [admin-domains]
      summary: Delete a domain
      responses:
        "204": { description: Deleted }

  /api/admin/system/schema-version:
    x-visibility: admin
    get:
      tags: [admin-system]
      summary: Database schema version status
      description: |
        Reports the database's current schema version vs the version the running
        gateway binary expects (the highest embedded forward migration). `mailctl
        schema check|apply` is the operator-side complement.
      responses:
        "200":
          description: Schema version status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaVersionStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/webhooks:
    x-visibility: admin
    get:
      tags: [admin-system]
      summary: List webhooks
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Webhook" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin-system]
      summary: Create a webhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreate" }
      responses:
        "201":
          description: Created (the signing secret is returned ONCE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/webhooks/{id}:
    x-visibility: admin
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    delete:
      tags: [admin-system]
      summary: Delete a webhook
      responses:
        "204": { description: Deleted }

  /scim/v2/Users:
    x-visibility: public
    get:
      tags: [scim]
      summary: List/filter SCIM users
      description: |
        SCIM 2.0 (RFC 7644). Enabled only when `SCIM_ENABLED=true`; authenticated
        with a source-bound SCIM bearer token
        (`mailctl scim create-token --source <active-scim-source-key>`), not a
        user JWT. Tokens bound to paused, retired, or non-SCIM sources are not
        accepted.
      security:
        - scimAuth: []
      responses:
        "200":
          description: SCIM ListResponse
          content:
            application/scim+json:
              schema: { type: object, additionalProperties: true }
    post:
      tags: [scim]
      summary: Provision a SCIM user
      security:
        - scimAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Created
          content:
            application/scim+json:
              schema: { type: object, additionalProperties: true }

  /scim/v2/Groups:
    x-visibility: public
    get:
      tags: [scim]
      summary: List/filter SCIM groups
      security:
        - scimAuth: []
      responses:
        "200":
          description: SCIM ListResponse
          content:
            application/scim+json:
              schema: { type: object, additionalProperties: true }
    post:
      tags: [scim]
      summary: Create a SCIM group
      security:
        - scimAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Created
          content:
            application/scim+json:
              schema: { type: object, additionalProperties: true }

  /api/admin/roles/{id}/members:
    x-visibility: admin
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    post:
      tags: [admin-roles]
      summary: Assign a single user to a role
      description: |
        Assigns one user to the role group. Validates Rule A (actor must hold every
        permission the role grants) and Rule B (actor must be able to reach the target
        via `admin_can_reach`). Accepts an optional scope (`scopeType`/`scopeId`);
        `scopeType` must be `"ou"` (department subtree) or `"set"` (named scope-set)
        when present — group/user → 400 "use a scope-set";
        `scopeId` is required when `scopeType` is set and vice versa.
        Bulk assignment (`POST …/members:bulk`) also accepts an optional scope
        (same shape, same validation rules).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:    { type: integer, format: int64 }
                expiresAt: { type: string, format: date-time, nullable: true }
                eligible:  { type: boolean, nullable: true, description: "When true (and rbac.jit is ON), the assignment is dormant-eligible — the user must call :activate before the role grants any permissions. Omit or false for a standing (always-active) assignment." }
                scopeType: { type: string, enum: [ou, set], nullable: true, description: "Scope type: 'ou' (department subtree) or 'set' (named scope-set). group/user → 400 use a scope-set." }
                scopeId:   { type: integer, format: int64, nullable: true, description: "Department id for 'ou'; scope-set id for 'set'. Required when scopeType is set." }
      responses:
        "204": { description: Assigned (or already a member; idempotent) }
        "400": { description: "Validation failure (bad scopeType, mismatched scopeType/scopeId, or Rule A violation)" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: SoD conflict or last-Super-Admin protection }

  /api/admin/roles/{id}/members:bulk:
    x-visibility: admin
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    post:
      tags: [admin-jobs]
      summary: Bulk-assign users to a role (enqueue)
      description: |
        Enqueues a durable bulk-assign job. The request validates Rule A
        (actor must hold every permission the role grants) and cap (≤1000
        userIds), then returns `202 { jobId }` immediately. The browser tab
        may close; the job persists. Poll `GET /admin/jobs/bulk_role/{id}` for
        per-user results. Accepts an optional uniform scope (`scopeType`/`scopeId`):
        `scopeType` must be `"ou"` or `"set"` when present — group/user → 400 use a
        scope-set; `scopeId` is required when `scopeType` is set. The reducer
        stamps this scope onto every target assignment row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [op, userIds]
              properties:
                op:       { type: string, enum: [assign] }
                userIds:  { type: array, items: { type: integer, format: int64 }, maxItems: 1000 }
                expiresAt: { type: string, format: date-time, nullable: true }
                eligible:  { type: boolean, nullable: true, description: "When true, every target assignment is dormant-eligible (requires :activate). Stamped into bulk_role_jobs.eligible and propagated by the worker to each admin_role_assignments row. Omit or false for standing grants." }
                scopeType: { type: string, enum: [ou, set], nullable: true, description: "Scope type: 'ou' (department subtree) or 'set' (named scope-set). Applied uniformly to every target. group/user → 400 use a scope-set." }
                scopeId:   { type: integer, format: int64, nullable: true, description: "Department id for 'ou'; scope-set id for 'set'. Required when scopeType is set." }
      responses:
        "202":
          description: Job enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: integer, format: int64 }
        "400": { description: Validation failure (empty/cap/past-expiresAt/bad role/bad scopeType) }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [admin-jobs]
      summary: Bulk-revoke users from a role (enqueue)
      description: |
        Enqueues a durable bulk-revoke job. Same durability + polling contract as
        `POST /admin/roles/{id}/members:bulk`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds: { type: array, items: { type: integer, format: int64 }, maxItems: 1000 }
      responses:
        "202":
          description: Job enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: integer, format: int64 }
        "400": { description: Validation failure (empty/cap/bad role) }
        "403": { $ref: "#/components/responses/Forbidden" }

