        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/drive/audit-alarms/{id}:
    x-visibility: public
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    patch:
      tags: [drive]
      summary: Update a Drive audit alarm
      description: Requires `drive.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriveAuditAlarmPatch" }
      responses:
        "204": { description: Alarm updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [drive]
      summary: Delete a Drive audit alarm
      description: Requires `drive.manage`.
      responses:
        "204": { description: Alarm deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/drive/export:
    x-visibility: public
    post:
      tags: [drive]
      summary: Request a single-use Drive export
      description: Returns the plaintext token once while only its hash is stored. The result is either immediately granted or pending approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriveExportRequest" }
      responses:
        "200":
          description: Granted or pending export request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriveExportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/drive/export/{token}:
    x-visibility: public
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [drive]
      summary: Consume a single-use Drive export token
      description: Burns the grant before streaming. Do not prefetch this URL; a dropped connection still consumes the token.
      responses:
        "200":
          description: Exported file bytes
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/drive/versions/{id}/labels:
    x-visibility: public
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    post:
      tags: [drive]
      summary: Add a free-form label to a file version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, maxLength: 60 }
      responses:
        "204": { description: Label set }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/drive/versions/{id}/labels/{label}:
    x-visibility: public
    parameters:
      - { $ref: "#/components/parameters/PathId" }
      - { name: label, in: path, required: true, schema: { type: string, maxLength: 60 } }
    delete:
      tags: [drive]
      summary: Remove a label from a file version
      responses:
        "204": { description: Label removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/exchange-replacement/registry:
    x-visibility: admin
    get:
      tags: [exchange-replacement]
      summary: Get the canonical Exchange replacement registry projection
      description: Requires `exchange.assessment.read`. The digest-bound projection is the shared authority for UI, CLI, reports, and claims.
      responses:
        "200": { description: Registry projection, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeRegistryProjection" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/exchange-replacement/projects:
    x-visibility: admin
    get:
      tags: [exchange-replacement]
      summary: List domain-scoped assessment projects
      description: Requires `exchange.assessment.read`; results are masked administrator metadata.
      responses:
        "200": { description: Projects, content: { application/json: { schema: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/ExchangeAssessmentProject" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [exchange-replacement]
      summary: Create an assessment project
      description: Requires `exchange.assessment.run`, fresh authority, one canonical `Idempotency-Key`, and `X-Audit-Reason`. Same-key/same-actor/same-payload replays the stored result; any changed binding conflicts. Feature-disabled requests fail closed.
      parameters: [{ $ref: "#/components/parameters/AuditReason" }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeAssessmentProjectCreate" } } } }
      responses:
        "201": { description: Created project, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeAssessmentProject" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/exchange-replacement/projects/{projectId}/runs:
    x-visibility: admin
    parameters: [{ name: projectId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }]
    get:
      tags: [exchange-replacement]
      summary: List immutable assessment runs
      responses:
        "200": { description: Runs, content: { application/json: { schema: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/ExchangeAssessmentRun" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [exchange-replacement]
      summary: Create an immutable assessment run
      parameters: [{ $ref: "#/components/parameters/AuditReason" }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeAssessmentRunCreate" } } } }
      responses:
        "201": { description: Created run, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeAssessmentRun" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/exchange-replacement/runs/{runId}/transition:
    x-visibility: admin
    parameters: [{ name: runId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }, { $ref: "#/components/parameters/AuditReason" }]
    post:
      tags: [exchange-replacement]
      summary: Generation-fenced run lifecycle transition
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [expectedGeneration, state], properties: { expectedGeneration: { type: integer, format: int64, minimum: 1 }, state: { type: string, enum: [preflight, uploading, validating, processing, partial, blocked, ready, failed, cancelled, expired, deletion_pending, deleted] }, errorCode: { type: [string, "null"], maxLength: 64 } } } } } }
      responses: { "200": { description: Updated run, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeAssessmentRun" } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" } }

  /api/admin/exchange-replacement/runs/{runId}/bundle:
    x-visibility: admin
    parameters:
      - { name: runId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - { $ref: "#/components/parameters/AuditReason" }
      - { name: X-Run-Generation, in: header, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - { name: X-Content-SHA256, in: header, required: true, schema: { $ref: "#/components/schemas/Sha256" } }
    put:
      tags: [exchange-replacement]
      summary: Encrypt and commit one verified assessment bundle
      description: Requires `exchange.assessment.run` and fresh AAL2. The server caps plaintext at 64 MiB, verifies the declared digest, applies installation/tenant/project AAD, stores only a crypto-profile-tagged envelope, and commits metadata through a generation-fenced reducer.
      requestBody:
        required: true
        content:
          application/vnd.setjoin.exchange-bundle+json:
            schema: { type: string, format: binary, maxLength: 67108864 }
      responses:
        "201": { description: Encrypted artifact committed, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/admin/exchange-replacement/runs/{runId}/decisions:
    x-visibility: admin
    parameters: [{ name: runId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }, { $ref: "#/components/parameters/AuditReason" }]
    post:
      tags: [exchange-replacement]
      summary: Set one generation-fenced capability decision
      description: Requires `exchange.assessment.decide`; there is intentionally no accept-all route.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeAssessmentDecisionRequest" } } } }
      responses: { "200": { description: Decision snapshot, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" } }

  /api/admin/exchange-replacement/runs/{runId}/attestations:
    x-visibility: admin
    parameters: [{ name: runId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }, { $ref: "#/components/parameters/AuditReason" }]
    post:
      tags: [exchange-replacement]
      summary: Create or exactly replay an assessment attestation
      description: Requires `exchange.assessment.attest`; collection-zero forbids the collector as attester.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [kind, subjectDigest, statement], properties: { kind: { type: string, enum: [collection_zero, completeness, handling, backup_expiry] }, subjectDigest: { $ref: "#/components/schemas/Sha256" }, statement: { type: object, maxProperties: 64, additionalProperties: true } } } } } }
      responses: { "201": { description: Attestation, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" } }

  /api/admin/exchange-replacement/runs/{runId}/claims/resolve:
    x-visibility: admin
    parameters: [{ name: runId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }, { $ref: "#/components/parameters/AuditReason" }]
    post:
      tags: [exchange-replacement]
      summary: Resolve a deterministic evidence-bound claim snapshot
      description: Requires `exchange.assessment.audit`. Replacement-ready remains false in V1A.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedGeneration]
              properties:
                expectedGeneration: { type: integer, format: int64, minimum: 1 }
      responses:
        "201":
          description: Claim snapshot
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/exchange-replacement/runs/{runId}/audit:
    x-visibility: admin
    parameters: [{ name: runId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }]
    get:
      tags: [exchange-replacement]
      summary: Read evidence, attestations, claim snapshots, and publications
      description: Requires the separately delegated `exchange.assessment.audit` permission and is fully audited.
      responses: { "200": { description: Audit snapshot, content: { application/json: { schema: { type: object, required: [claims, attestations, evidence, publications], properties: { claims: { type: array, items: { type: object, additionalProperties: true } }, attestations: { type: array, items: { type: object, additionalProperties: true } }, evidence: { type: array, items: { type: object, additionalProperties: true } }, publications: { type: array, items: { type: object, additionalProperties: true } } } } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } }

  /api/admin/exchange-replacement/runs/{runId}/publications:
    x-visibility: admin
    parameters: [{ name: runId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }, { $ref: "#/components/parameters/AuditReason" }]
    post:
      tags: [exchange-replacement]
      summary: Publish an evidence-complete claim snapshot
      description: Requires `exchange.assessment.publish`; stale, unassessed, or waiver-self-published claims fail closed. The server creates, encrypts, and signs the receipt with the installation continuity key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectionDigest]
              properties:
                projectionDigest: { $ref: "#/components/schemas/Sha256" }
      responses:
        "201": { description: Publication receipt, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/exchange-replacement/projects/{projectId}/deletions:
    x-visibility: admin
    parameters: [{ name: projectId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }, { $ref: "#/components/parameters/AuditReason" }]
    post:
      tags: [exchange-replacement]
      summary: Request artifact, run, or project deletion
      description: Requires `exchange.assessment.delete`. The response describes active-store versus backup-expiry state and never promises deletion of external copies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope, reason]
              properties:
                scope: { type: string, enum: [artifact, run, project] }
                runId: { type: [integer, "null"], format: int64, minimum: 1 }
                artifactId: { type: [integer, "null"], format: int64, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        "202": { description: Durable deletion request, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT access token from `POST /auth/login`.
    scimAuth:
      type: http
      scheme: bearer
      description: An active-source-bound SCIM provisioning token (`mailctl scim create-token --source <active-scim-source-key>`).
  parameters:
    AuditReason:
      name: X-Audit-Reason
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 1024 }
      description: Human-authored reason retained in the immutable administrative audit trail.
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Resource id (integer id as a string).
    IdentityCursor:
      name: cursor
      in: query
      description: >-
        Opaque, actor/scope/filter/sort-bound resume cursor. Cursors expire
        after 15 minutes; changing any bound input returns 400 and expiry
        returns 410.
      schema: { type: string, minLength: 1, maxLength: 4096 }
    IdentityLimit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    IdentityFilter:
      name: filter
      in: query
      description: Bounded case-insensitive display filter; never accepts a raw external subject.
      schema: { type: string, maxLength: 256 }
    IdentitySourceFilter:
      name: source
      in: query
      description: Exact immutable source key.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9:_.-]+$"
    IdentityIfNoneMatch:
      name: If-None-Match
      in: header
      description: Return 304 when this strong ETag still identifies the exact page.
      schema: { type: string, maxLength: 80 }
    IdentityPreviewIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag equal to the exact lowercase preview or rollback-preview digest.
      schema: { type: string, pattern: '^"[0-9a-f]{64}"$' }
    IdentityGenerationIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag equal to the current decimal transition generation.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    IdentityIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID that must exactly match body idempotencyKey.
      schema: { type: string, format: uuid }
    DriveIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID that must exactly match body idempotencyKey.
      schema: { type: string, format: uuid }
    IdentityAuditReason:
      name: X-Audit-Reason
      in: header
      required: true
      description: Audited reason that must exactly match the body reason.
      schema: { type: string, minLength: 1, maxLength: 1024 }
  headers:
    IdentityETag:
      description: Strong version for the exact response page or resource.
      schema: { type: string, pattern: '^"[0-9a-f]{64}"$|^"[1-9][0-9]*"$' }
    IdentityLocation:
      description: Canonical poll URL for a durably accepted identity job.
      schema: { type: string, pattern: "^/api/admin/identity/v2/(jobs|diagnostics)/[0-9a-f-]{36}$" }
  responses:
    Unauthorized:
      description: Authentication is required or the session is no longer valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: Malformed path, query parameter, headers, or JSON body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Caller lacks the required permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The requested transition conflicts with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Gone:
      description: The opaque cursor or other bounded artifact has expired
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      description: The supplied If-Match version does not match the current resource
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: The request body exceeds the route's declared byte limit
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: The bounded route-specific rate limit was exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalServerError:
      description: An internal or dependency failure prevented a complete response
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: The identity worker database is unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    IdentityTransitionOK:
      description: Updated authoritative transition state
      headers:
        ETag: { $ref: "#/components/headers/IdentityETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IdentityTransitionDetail" }
    IdentityTransitionAccepted:
      description: Transition command durably accepted
      headers:
        ETag: { $ref: "#/components/headers/IdentityETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IdentityTransitionDetail" }
    UnprocessableEntity:
      description: The request is syntactically valid but violates a Drive contract
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"
    OfficeAppRecovery:
      type: object
      additionalProperties: false
      required: [problem, effect, remedy]
      properties:
        problem: { type: string }
        effect: { type: string }
        remedy: { type: string }
    OfficeAppOperation:
      type: object
      additionalProperties: false
      required: [operationId, appId, kind, state, stateGeneration, phase, progress, error, allowedActions, recovery, createdAt, updatedAt]
      properties:
        operationId: { type: string, format: uuid }
        appId: { type: string, enum: [collabora-code] }
        kind: { type: string, enum: [install] }
        state: { type: string, enum: [requested, claimed, preflight, pulling, verifying, staging, starting, qualifying, connected_inactive, disabling_launches, draining, blocked_drain, rolling_back, rolled_back, retention_pending, removed, paused_recoverable, failed_terminal, cancelled] }
        stateGeneration: { type: integer, format: int64, minimum: 1 }
        phase: { type: string }
        progress: { type: object, additionalProperties: true }
        error: { type: [object, "null"], additionalProperties: true }
        providerId: { type: string }
        allowedActions:
          type: array
          items: { type: string, enum: [install, recover] }
        recovery:
          oneOf:
            - { $ref: "#/components/schemas/OfficeAppRecovery" }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OfficeAdminState:
      type: object
      additionalProperties: false
      required: [providers, qualifications, health, operations, features]
      properties:
        providers: { type: array, items: { type: object, additionalProperties: true } }
        qualifications: { type: array, items: { type: object, additionalProperties: true } }
        health: { type: array, items: { type: object, additionalProperties: true } }
        operations: { type: array, items: { $ref: "#/components/schemas/OfficeAppOperation" } }
        features:
          type: object
          additionalProperties: false
          required: [driveHistory, officeEditing, officeLocalOpen, officeManagedDelivery]
          properties:
            driveHistory: { type: boolean }
            officeEditing: { type: boolean }
            officeLocalOpen: { type: boolean }
            officeManagedDelivery: { type: boolean }
    OfficeAppsState:
      type: object
      additionalProperties: false
      required: [app, revisions, operations]
      properties:
        app:
          type: object
          additionalProperties: false
          required: [appId, name, channel, managedDeliveryEnabled, allowedActions, providerReadiness]
          properties:
            appId: { type: string, const: collabora-code }
            name: { type: string }
            channel: { type: string, const: test }
            managedDeliveryEnabled: { type: boolean }
            allowedActions: { type: array, items: { type: string, enum: [install] } }
            providerReadiness:
              type: [object, "null"]
              additionalProperties: false
              properties:
                providerId: { type: string }
                generation: { type: integer, format: int64, minimum: 1 }
                ready: { type: boolean }
                state: { type: string }
                remedy: { type: [string, "null"] }
        revisions: { type: array, items: { type: object, additionalProperties: true } }
        operations: { type: array, items: { $ref: "#/components/schemas/OfficeAppOperation" } }
    ExchangeRegistryProjection:
      type: object
      additionalProperties: false
      required: [schemaVersion, registryVersion, catalogVersion, sourceDigest, capabilities, supportCells]
      properties:
        schemaVersion: { type: string, const: setjoin.exchange.projection/v1 }
        registryVersion: { type: integer, minimum: 1 }
        catalogVersion: { type: integer, minimum: 1 }
        sourceDigest: { $ref: "#/components/schemas/Sha256" }
        generatedFrom: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: object, additionalProperties: true } }
        roots: { type: array, items: { type: object, additionalProperties: true } }
        probes: { type: array, items: { type: object, additionalProperties: true } }
        supportCells: { type: array, items: { type: object, additionalProperties: true } }
        redactionProfiles: { type: array, items: { type: object, additionalProperties: true } }
    ExchangeAssessmentProject:
      type: object
      additionalProperties: false
      required: [id, domainId, name, state, createdAt, updatedAt]
      properties:
