  /api/admin/me/roles/{id}/activate:
    x-visibility: public
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    post:
      tags: [admin-jit]
      summary: Activate a JIT-eligible role assignment
      description: |
        Opens a time-boxed activation window on the caller's eligible assignment
        for role `{id}`. Auth: `requireAuth` only (actor = claims.UserID — never
        from the request body, DATABASE_SECURITY R2/R3). Returns `activatedUntil`
        timestamp. If the token predates the eligible assignment (`IsAdmin=false`
        while the user now has an eligible grant), the response includes
        `tokenRefreshRequired:true` — the webmail should refresh the session before
        deriving admin consoles (D6 cold-start signal).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durationMinutes]
              properties:
                durationMinutes:
                  type: integer
                  minimum: 1
                  description: Desired window length in minutes (clamped to the role's policy max).
                justification:
                  type: string
                  nullable: true
                  description: Required when the role's activation policy sets requireJustification.
      responses:
        "200":
          description: Activation window opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  activatedUntil:
                    type: string
                    format: date-time
                  tokenRefreshRequired:
                    type: boolean
                    description: "Present and true when the caller's token predates the eligible assignment (D6 cold-start: token IsAdmin=false but now has an active window). Webmail must POST /auth/refresh before re-deriving consoles."
        "400":
          description: |
            `BZ104` — JIT is not enabled or the caller has no eligible assignment for this role.
            `BZ105` — justification is required but was absent or empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/admin/me/roles/{id}/deactivate:
    x-visibility: public
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    post:
      tags: [admin-jit]
      summary: Deactivate a JIT activation window early
      description: |
        NULLs `activated_until` on the caller's eligible assignment, ending the
        active window immediately. Auth: `requireAuth` only (self-service).
        No-op if the assignment is not currently active; never errors on absent
        assignment (idempotent). Returns `{}`.
      responses:
        "200":
          description: Window ended (or was already closed)
          content:
            application/json:
              schema: { type: object }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/admin/roles/{id}/activation-policy:
    x-visibility: admin
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    get:
      tags: [admin-jit]
      summary: Get the JIT activation policy for a role
      description: |
        Returns the per-role `admin_role_activation_policy` row. When no override
