                requireJustification: { type: boolean }
      responses:
        "200":
          description: Updated activation policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  roleGroupId:          { type: integer, format: int64 }
                  maxDurationMinutes:   { type: integer }
                  requireJustification: { type: boolean }
        "400": { description: "maxDurationMinutes must be positive, or invalid JSON" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/system/jit-defaults:
    x-visibility: admin
    get:
