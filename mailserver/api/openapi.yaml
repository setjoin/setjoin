    head:
      tags: [drive]
      summary: Probe a chunk with proof-of-possession protection
      description: Returns 200 only when the caller can prove access to the chunk; every other existence state is the same 404.
      responses:
        "200": { description: Chunk exists and is accessible }
        "400": { $ref: "#/components/responses/BadRequest" }
