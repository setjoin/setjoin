      required: [previewDigest, idempotencyKey]
      properties:
        previewDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        idempotencyKey: { type: string, format: uuid }
    IdentityTransitionChallengeCompleteRequest:
      type: object
      additionalProperties: false
      required: [challengeId, previewDigest, idempotencyKey]
      properties:
        challengeId: { type: string, format: uuid }
        previewDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        idempotencyKey: { type: string, format: uuid }
    IdentityTransitionChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, transitionId, transitionGeneration, previewDigest, expiresAt, handoffMethod, displayCode, completed, invalidated]
      properties:
        challengeId: { type: string, format: uuid }
        transitionId: { type: string, format: uuid }
        transitionGeneration: { type: string, pattern: "^[1-9][0-9]*$" }
        previewDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        expiresAt: { type: string, format: date-time }
        handoffMethod: { type: string, enum: [browser] }
        displayCode: { type: string, pattern: "^[0-9A-F]{8}$" }
        completed: { type: boolean }
        invalidated: { type: boolean }
    IdentityTransitionElevation:
      type: object
      additionalProperties: false
      required: [challengeId, elevationId, transitionId, transitionGeneration, expiresAt, consumed, invalidated, replayed]
      properties:
        challengeId: { type: string, format: uuid }
        elevationId: { type: string, format: uuid }
        transitionId: { type: string, format: uuid }
        transitionGeneration: { type: string, pattern: "^[1-9][0-9]*$" }
        expiresAt: { type: string, format: date-time }
        consumed: { type: boolean }
        invalidated: { type: boolean }
        replayed: { type: boolean }
    IdentityTransitionAuthorizedRequest:
      type: object
      additionalProperties: false
      required: [previewDigest, elevationId, reason, idempotencyKey]
      properties:
        previewDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        elevationId: { type: string, format: uuid }
        approvalRequestId: { type: string, pattern: "^[1-9][0-9]*$" }
        reason: { type: string, minLength: 1, maxLength: 1024 }
        idempotencyKey: { type: string, format: uuid }
    IdentityTransitionGenerationRequest:
      type: object
      additionalProperties: false
      required: [expectedGeneration, reason, idempotencyKey]
      properties:
        expectedGeneration: { type: string, pattern: "^[1-9][0-9]*$" }
        reason: { type: string, minLength: 1, maxLength: 1024 }
        idempotencyKey: { type: string, format: uuid }
    IdentityDoctorCheck:
      type: object
      additionalProperties: false
      required: [name, severity, passed, facts, nextAction]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        severity: { type: string, enum: [info, warning, blocker] }
        passed: { type: boolean }
        facts:
          type: object
          additionalProperties: true
          maxProperties: 32
        nextAction: { type: string, minLength: 1, maxLength: 256 }
    IdentityDoctor:
      type: object
      additionalProperties: false
      required: [generatedAt, passed, blockingCount, checks]
      properties:
        generatedAt: { type: string, format: date-time }
        sourceKey: { type: [string, "null"], maxLength: 64 }
        passed: { type: boolean }
        blockingCount: { type: integer, minimum: 0 }
        checks:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/IdentityDoctorCheck" }
    IdentityInventoryExport:
      type: object
      additionalProperties: false
      required: [manifestVersion, schemaVersion, generatedAt, redactionPolicy, sources, people, conflicts, redactionCounts, sha256]
      properties:
        manifestVersion: { type: string, const: "1" }
        schemaVersion: { type: integer, minimum: 167 }
        generatedAt: { type: string, format: date-time }
        redactionPolicy: { type: string, const: identity-inventory-v1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        sources:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [sourceKey, kind, state, generation, readMode, activeLinks, openConflicts]
            properties:
              sourceKey: { type: string, maxLength: 64 }
              kind: { type: string, enum: [local, ad, ldap, scim, saml, oidc] }
              state: { type: string }
              generation: { type: string, pattern: "^[1-9][0-9]*$" }
              readMode: { type: string, enum: [legacy, shadow, canary, normalized] }
              activeLinks: { type: integer, minimum: 0 }
              openConflicts: { type: integer, minimum: 0 }
        people:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [userId, enabled, accountClass, activeLinks, detachedLinks]
            properties:
              userId: { type: string, pattern: "^[1-9][0-9]*$" }
              enabled: { type: boolean }
              accountClass: { type: string, enum: [member, guest, unclassified] }
              lifecycleAuthority: { type: [string, "null"], enum: [local, source, null] }
              activeLinks: { type: integer, minimum: 0 }
              detachedLinks: { type: integer, minimum: 0 }
        conflicts:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [id, sourceKey, evidenceClass, state, generation, createdAt, expiresAt]
            properties:
              id: { type: string, format: uuid }
              sourceKey: { type: string, maxLength: 64 }
              evidenceClass: { type: string, enum: [hard, composite, soft, conflict] }
              state: { type: string }
              generation: { type: string, pattern: "^[1-9][0-9]*$" }
              createdAt: { type: string, format: date-time }
              expiresAt: { type: string, format: date-time }
        redactionCounts:
          type: object
          additionalProperties: false
          required: [emailsOmitted, externalSubjectsOmitted, candidateSubjectsOmitted, secretsOmitted]
          properties:
            emailsOmitted: { type: integer, minimum: 0 }
            externalSubjectsOmitted: { type: integer, minimum: 0 }
            candidateSubjectsOmitted: { type: integer, minimum: 0 }
            secretsOmitted: { type: integer, minimum: 0 }
    IdentityJob:
      type: object
      additionalProperties: false
      required: [jobId, kind, state, snapshotId, createdAt, expiresAt, progress, nextAction, terminal, cancelRequested]
      properties:
        jobId: { type: string, format: uuid }
        kind: { type: string, enum: [upgrade_backfill, diagnostics, cohort_preview] }
        state: { type: string, enum: [queued, running, completed, completed_with_failures, failed, cancelled, expired] }
        snapshotId: { type: string, format: uuid }
        sourceKey: { type: string, maxLength: 64 }
        transitionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        progress:
          type: object
          additionalProperties: true
          maxProperties: 16
        nextAction: { type: string, minLength: 1, maxLength: 256 }
        terminal: { type: boolean }
        cancelRequested: { type: boolean }
        manifestVersion: { type: string, const: "1" }
        byteCount: { type: integer, minimum: 0, maximum: 26214400 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        redactionCounts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          maxProperties: 16
    IdentityJobResults:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [sequence, state, result, createdAt]
            properties:
              sequence: { type: string, pattern: "^[1-9][0-9]*$" }
              userId: { type: string, pattern: "^[1-9][0-9]*$" }
              state: { type: string, enum: [completed, failed, skipped, blocked] }
              result:
                type: object
                additionalProperties: true
                maxProperties: 32
              createdAt: { type: string, format: date-time }
        nextSequence: { type: [string, "null"], pattern: "^[1-9][0-9]*$" }
    IdentityDiagnosticCreateRequest:
      type: object
      additionalProperties: false
      required: [sinceSeconds, reason, idempotencyKey]
      properties:
        sourceKey: { type: string, minLength: 1, maxLength: 64 }
        transitionId: { type: string, format: uuid }
        sinceSeconds: { type: integer, minimum: 1, maximum: 86400 }
        reason: { type: string, minLength: 1, maxLength: 1024 }
        idempotencyKey: { type: string, format: uuid }
      oneOf:
        - required: [sourceKey]
          not: { required: [transitionId] }
        - required: [transitionId]
          not: { required: [sourceKey] }
    IdentityReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1024 }
    IdentityUpgradePreflight:
      type: object
      additionalProperties: false
      required: [manifestVersion, generatedAt, phase, checks, blockers, safeToBackfill, featureFlags, estimates, sha256]
      properties:
        manifestVersion: { type: string, const: "1" }
        generatedAt: { type: string, format: date-time }
        phase: { type: string, const: preflight }
        checks:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/IdentityDoctorCheck" }
        blockers:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 128 }
        safeToBackfill: { type: boolean }
        featureFlags:
          type: object
          additionalProperties: false
          required: [identityModelV2, normalizedReads, transitions]
          properties:
            identityModelV2: { type: boolean }
            normalizedReads: { type: boolean }
            transitions: { type: boolean }
        estimates:
          type: object
          additionalProperties: false
          required: [people, maximumBatchSize, maximumDurationSeconds]
          properties:
            people: { type: integer, minimum: 0 }
            maximumBatchSize: { type: integer, const: 500 }
            maximumDurationSeconds: { type: integer, const: 900 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    IdentityUpgradeBackfillRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [plan, start] }
        preflightChecksum: { type: string, pattern: "^[0-9a-f]{64}$" }
        reason: { type: string, minLength: 1, maxLength: 1024 }
        idempotencyKey: { type: string, format: uuid }
      oneOf:
        - properties: { action: { const: plan } }
        - required: [preflightChecksum, reason, idempotencyKey]
          properties: { action: { const: start } }
    IdentityUpgradeShadow:
      type: object
      additionalProperties: false
      required: [sourceKey, eligible, completedSyncs, requiredSyncs, windowHours, requiredWindowHours, criticalDivergences, missingProjections, undispositionedAmbiguities, nextAction]
      properties:
        sourceKey: { type: string, maxLength: 64 }
        eligible: { type: boolean }
        completedSyncs: { type: integer, minimum: 0, maximum: 7 }
        requiredSyncs: { type: integer, const: 7 }
        windowStartedAt: { type: [string, "null"], format: date-time }
        windowHours: { type: number, minimum: 0 }
        requiredWindowHours: { type: integer, const: 24 }
        criticalDivergences: { type: integer, minimum: 0 }
        missingProjections: { type: integer, minimum: 0 }
        undispositionedAmbiguities: { type: integer, minimum: 0 }
        nextAction: { type: string, minLength: 1, maxLength: 256 }
    IdentityUpgradeRetirementCheck:
      type: object
      additionalProperties: false
      required: [ready, destructiveMigrationIncluded, checks, nextAction]
      properties:
        ready: { type: boolean }
        destructiveMigrationIncluded: { type: boolean, const: false }
        checks:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [name, passed, nextAction]
            properties:
              name: { type: string, maxLength: 128 }
              passed: { type: boolean }
              nextAction: { type: string, minLength: 1, maxLength: 256 }
        nextAction: { type: string, minLength: 1, maxLength: 256 }
    IdentityUpgradeStatus:
      type: object
      additionalProperties: true
      required: [schemaVersion, masterEnabled, normalizedReadsEnabled, transitionsEnabled, sources, blockers]
      properties:
        schemaVersion: { type: integer, minimum: 164 }
        masterEnabled: { type: boolean }
        normalizedReadsEnabled: { type: boolean }
        transitionsEnabled: { type: boolean }
        sources:
          type: object
          additionalProperties: false
          required: [total, shadow, canary, normalized, cohortMembers]
          properties:
            total: { type: integer, minimum: 0 }
            shadow: { type: integer, minimum: 0 }
            canary: { type: integer, minimum: 0 }
            normalized: { type: integer, minimum: 0 }
            cohortMembers: { type: integer, minimum: 0 }
        blockers:
          type: object
          additionalProperties: false
          required: [criticalDivergences, pendingCandidates, pendingEffects]
          properties:
            criticalDivergences: { type: integer, minimum: 0 }
            pendingCandidates: { type: integer, minimum: 0 }
            pendingEffects: { type: integer, minimum: 0 }
    IdentityUpgradeCanaryRequest:
      type: object
      additionalProperties: false
      required: [sourceKey, expectedGeneration, enabled, userIds, reason]
      properties:
        sourceKey: { type: string, minLength: 1, maxLength: 64 }
        expectedGeneration: { type: string, pattern: "^[1-9][0-9]*$" }
        enabled: { type: boolean }
        userIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, pattern: "^[1-9][0-9]*$" }
        reason: { type: string, minLength: 1, maxLength: 1024 }
    IdentityUpgradeCanaryResult:
      type: object
      additionalProperties: false
      required: [sourceKey, generation, readMode, cohortSize]
      properties:
        sourceKey: { type: string }
        generation: { type: string, pattern: "^[1-9][0-9]*$" }
        readMode: { type: string, enum: [shadow, canary] }
        cohortSize: { type: integer, minimum: 0, maximum: 500 }
    IdentityUpgradeRollbackRequest:
      type: object
      additionalProperties: false
      required: [readPath, reason]
      properties:
        readPath: { type: string, const: legacy }
        reason: { type: string, minLength: 1, maxLength: 1024 }
    IdentityUpgradeRollbackResult:
      type: object
      additionalProperties: true
      required: [rolledBack, pendingEffects]
      properties:
        rolledBack: { type: boolean, const: true }
        pendingEffects: { type: integer, minimum: 0 }
    Problem:
      type: object
      description: >-
        RFC 7807/9457 problem detail. Reducer-backed endpoints may add a
        client-actionable BZ code, retryability, and bounded remediation.
        Unknown or internal failures omit the BZ code.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        invalid-params:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
        remediation:
          type: string
          description: Bounded human/operator next action or a stable access-remediation token.
        remediation_tou_id:
          type: integer
          format: int64
          description: Terms-of-use identifier when remediation is terms.
        code:
          type: string
          pattern: '^BZ[0-9]{3}$'
          description: Known client-actionable reducer error code; omitted for internal failures.
        retryable:
          type: boolean
          description: Whether the same request may succeed after a transient dependency recovers.
        holderId:
          type: integer
          format: int64
          description: Drive hard-lock holder extension, present only for the applicable lock conflict.
    SharingDefaultRow:
      type: object
      description: One sharing_defaults rule as the end-user panel sees it.
      properties:
        id:          { type: integer, format: int64 }
        ownerScope:  { type: string, enum: [org, ou, group, user] }
        audience:    { type: string, enum: [everyone, ou, group] }
        audienceRef: { type: integer, format: int64 }
        level:       { type: string, enum: [none, freebusy, read] }
    SharingDefaultAdminRow:
      type: object
      description: One sharing_defaults rule with resolved human labels (admin console).
      properties:
        id:            { type: integer, format: int64 }
        resource:      { type: string, enum: [calendar] }
        ownerScope:    { type: string, enum: [org, ou, group, user] }
        ownerRef:      { type: integer, format: int64 }
        ownerLabel:    { type: string }
        audience:      { type: string, enum: [everyone, ou, group] }
        audienceRef:   { type: integer, format: int64 }
        audienceLabel: { type: string }
        level:         { type: string, enum: [none, freebusy, read] }
        createdBy:     { type: integer, format: int64 }
        updatedAt:     { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      properties:
        access_token: { type: string, description: JWT access token }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Access-token lifetime (seconds) }
    MfaChallenge:
      type: object
      description: 202 body when a valid login needs a second factor.
      required: [mfa_required, status, mfa_method, mfa_token]
      properties:
        mfa_required: { type: boolean, const: true }
        status:       { type: string, const: mfa_required }
        mfa_method:   { type: string, enum: [push, totp] }
        mfa_token:    { type: string, description: MFA-pending JWT to complete the challenge }
        nonce:        { type: string, description: Push challenge nonce (push only) }
        ttl_seconds:  { type: integer, description: Push challenge lifetime (push only) }
        fallback:     { type: array, items: { type: string }, description: "Alternate methods, e.g. totp / backup_codes" }
    LoginGate:
      type: object
      description: >-
        403 body when access is gated before tokens issue. Two variants: an
        admin-forced password change (force_password_change + force_token) or
        required MFA enrollment (status=mfa_enrollment_required + mfa_token).
      properties:
        status:                { type: string, description: "'mfa_enrollment_required' for the enrollment variant; absent for the password-change variant" }
        mfa_required:          { type: boolean }
        mfa_token:             { type: string }
        force_password_change: { type: boolean }
        force_token:           { type: string }
        reason:                { type: string }
        message:               { type: string }
    JmapSession:
      type: object
      description: RFC 8620 §2 session object (abridged).
      properties:
        capabilities: { type: object, additionalProperties: true }
        accounts: { type: object, additionalProperties: true }
        primaryAccounts: { type: object, additionalProperties: { type: string } }
        username: { type: string }
        apiUrl: { type: string }
        uploadUrl: { type: string }
        downloadUrl: { type: string }
        state: { type: string }
    JmapRequest:
      type: object
      required: [using, methodCalls]
      properties:
        using:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:jmap:core", "urn:ietf:params:jmap:mail"]
        methodCalls:
          type: array
          items:
            type: array
            description: "[methodName, arguments, callId]"
    Domain:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        isLocal: { type: boolean }
    DomainCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
    SchemaVersionStatus:
      type: object
      properties:
        current: { type: integer, description: MAX(schema_migrations.version) }
        expected: { type: integer, description: Highest migration the binary ships }
        up_to_date: { type: boolean }
        pending:
          type: array
          items: { type: string }
          description: Pending migration filenames
    Webhook:
      type: object
      properties:
        id: { type: integer, format: int64 }
        url: { type: string, format: uri }
        eventTypes:
          type: array
          items: { type: string }
        secret: { type: string, description: Returned ONLY on create/rotate }
    WebhookCreate:
      type: object
      required: [url, eventTypes]
      properties:
        url: { type: string, format: uri }
        eventTypes:
          type: array
          items: { type: string }
    ApprovalRequestItem:
      type: object
      properties:
        id:              { type: integer, format: int64 }
        consumerType:    { type: string, enum: [rbac.jit_activation, mail.external_send, mail.group_moderation, hr.leave, hr.expense, guest.invite, drive.export, drive.share, drive.access] }
        subject:         { type: string }
        status:          { type: string, enum: [pending, approved, denied, expired] }
        requesterUserId: { type: integer, format: int64 }
        approverKind:    { type: string, enum: [user, role_group] }
        approverRef:     { type: integer, format: int64 }
        createdAt:       { type: string, format: date-time }
        expiresAt:       { type: string, format: date-time }
        decidedAt:       { type: string, format: date-time, nullable: true }
        decidedByUserId: { type: integer, format: int64, nullable: true }
        decisionComment: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true, description: Sanitized consumer evidence; Drive access uses decimal-string ids and requested bounds. }
    DriveOpaqueResult:
      type: object
      description: Reducer-owned result object whose exact fields depend on the operation.
      additionalProperties: true
    DriveCapability:
      type: string
      enum: [traverse, list_children, read_metadata, preview, download, create_child, modify_content, rename, move, delete, manage_acl, view_audit]
    DriveACLSubject:
      type: object
      additionalProperties: false
      required: [kind, id, label]
      properties:
        kind: { type: string, enum: [user, group] }
        id: { type: string, pattern: "^[1-9][0-9]*$" }
        label: { type: string, minLength: 1, maxLength: 255 }
        secondary: { type: string, maxLength: 320 }
    DriveACLGrantInput:
      type: object
      additionalProperties: false
      required: [subjectKind, subjectId, preset, scope]
      properties:
        subjectKind: { type: string, enum: [user, group] }
        subjectId: { type: string, pattern: "^[1-9][0-9]*$" }
        preset: { type: string, enum: [viewer, contributor, editor, folder_manager] }
        scope: { type: string, enum: [self, subtree] }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer, minimum: 1, maximum: 1000000 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    DriveACLGrantCommit:
      type: object
      additionalProperties: false
      required: [subjectKind, subjectId, preset, scope, expectedEpoch, idempotencyKey]
      properties:
        subjectKind: { type: string, enum: [user, group] }
        subjectId: { type: string, pattern: "^[1-9][0-9]*$" }
        preset: { type: string, enum: [viewer, contributor, editor, folder_manager] }
        scope: { type: string, enum: [self, subtree] }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer, minimum: 1, maximum: 1000000 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        expectedEpoch: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        idempotencyKey: { type: string, format: uuid }
    DriveACLRevokeInput:
      type: object
      additionalProperties: false
      required: [expectedEpoch, reason]
      properties:
        expectedEpoch: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    DriveACLGrantPreview:
      type: object
      additionalProperties: false
      required: [spaceId, nodeId, subjectKind, preset, capabilities, propagation]
      properties:
        spaceId: { type: string, pattern: "^[1-9][0-9]*$" }
        nodeId: { type: string, pattern: "^[1-9][0-9]*$" }
        subjectKind: { type: string, enum: [user, group] }
        subjectUserId: { type: [string, "null"], pattern: "^[1-9][0-9]*$" }
        subjectGroupId: { type: [string, "null"], pattern: "^[1-9][0-9]*$" }
        subjectGeneration: { type: [string, "null"], pattern: "^[1-9][0-9]*$" }
        preset: { type: string, enum: [viewer, contributor, editor, folder_manager] }
        capabilities: { type: array, minItems: 1, maxItems: 12, uniqueItems: true, items: { $ref: "#/components/schemas/DriveCapability" } }
        propagation: { type: string, enum: [self, subtree] }
        startsAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        maxUses: { type: [integer, "null"], minimum: 1, maximum: 1000000 }
    DriveACLMutationResult:
      type: object
      additionalProperties: false
      properties:
        grantId: { type: string, pattern: "^[1-9][0-9]*$" }
        nodeId: { type: string, pattern: "^[1-9][0-9]*$" }
        spaceId: { type: string, pattern: "^[1-9][0-9]*$" }
        epoch: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        invalidationCursor: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
