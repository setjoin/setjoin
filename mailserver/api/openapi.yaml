  /api/admin/scope-sets/{id}/members:
    x-visibility: admin
    parameters:
      - { $ref: "#/components/parameters/PathId" }
    post:
      tags: [admin-roles]
      summary: Add a member to a scope set
      description: |
        Adds a single member (ou/group/user) to the set. Per-type validation:
        - `ou` — `admin_scope_within` checks the OU is within the actor's reach.
        - `user` — `admin_can_reach` checks the target is reachable by the actor.
        - `group` — group must not be dynamic (`is_dynamic=false`) AND must be eligible
          (`scim_external_id IS NOT NULL OR usable_as_admin_scope`); all static members'
          primary-mailbox users must be reachable by the actor.
        Idempotent: adding an existing member returns 200 without re-auditing.
        Returns 201 on a new insertion. Audited at tier core.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberType, memberId]
              properties:
                memberType: { type: string, enum: [ou, group, user] }
                memberId:   { type: integer, format: int64 }
      responses:
        "200": { description: Member already present (idempotent no-op) }
        "201": { description: Member added }
        "400": { description: "Invalid memberType, dynamic group, or ineligible group" }
        "403": { description: OU or user is outside the actor's admin reach }
        "404": { description: Scope set or group not found }

  /api/admin/scope-sets/{id}/members/{memberType}/{memberId}:
    x-visibility: admin
