UserParameter=gateway.identity.inbox_pending,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^gateway_identity_inbox_pending ' | awk '{print $2}'
UserParameter=gateway.identity.conflicts,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^gateway_identity_conflicts_pending ' | awk '{print $2}'
