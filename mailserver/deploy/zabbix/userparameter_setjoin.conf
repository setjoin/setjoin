UserParameter=gateway.identity.effects,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^gateway_identity_effects_pending ' | awk '{print $2}'
UserParameter=gateway.identity.cursor_age,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^setjoin_identity_cursor_age_seconds ' | awk '{print $2}'
