UserParameter=gateway.identity.transition_age,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^setjoin_identity_transition_age_seconds ' | awk '{print $2}'
UserParameter=gateway.identity.effect_age,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^setjoin_identity_effect_oldest_age_seconds ' | awk '{print $2}'
UserParameter=gateway.identity.approvals_pending,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^gateway_identity_approvals_pending ' | awk '{print $2}'
UserParameter=gateway.identity.approval_expiry,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^gateway_identity_approval_expiry_seconds ' | awk '{print $2}'
