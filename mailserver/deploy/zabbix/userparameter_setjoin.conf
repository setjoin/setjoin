# SetJoin Gateway — Zabbix user parameters
# Place at: /etc/zabbix/zabbix_agentd.d/userparameter_setjoin.conf
# Requires: curl, grep, awk, and /etc/setjoin/metrics-curl.conf containing the
# protected Authorization header. Keeping it in a curl config avoids placing
# METRICS_TOKEN in process arguments.
#
# Metrics source: http://127.0.0.1/metrics (Prometheus text format)
# Note: items marked [future] require the /metrics handler to be extended
# with additional gauge exports. They will return empty/0 until implemented.

# Health check — HTTP status code from /health endpoint
UserParameter=gateway.health,curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/health

# SMTP outbound queue depth (exists in handler.go: gateway_smtp_queue_depth gauge)
UserParameter=gateway.queue.depth,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^gateway_smtp_queue_depth' | awk '{print $2}'

# Oldest queued item age in seconds [future — gateway_queue_oldest_seconds not yet in handler.go]
UserParameter=gateway.queue.oldest,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^gateway_queue_oldest_seconds' | awk '{print $2}'

# Database replication lag in seconds [future — gateway_db_replication_lag not yet in handler.go]
UserParameter=gateway.db.replication_lag,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^gateway_db_replication_lag' | awk '{print $2}'

# Database connections [future — gateway_db_connections not yet in handler.go]
UserParameter=gateway.db.connections,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^gateway_db_connections' | awk '{print $2}'

# S3 operation latency [future — gateway_s3_operation_duration_seconds not yet in handler.go]
UserParameter=gateway.s3.latency,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^gateway_s3_operation_duration_seconds' | awk '{print $2}'

# Auth failures — sum all gateway_request_4xx_total counters (exists in handler.go)
UserParameter=gateway.auth.failures,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^gateway_request_4xx_total' | awk '{s+=$2} END {print s+0}'

# TLS certificate expiry in seconds [future — gateway_tls_cert_expiry_seconds not yet in handler.go]
UserParameter=gateway.tls.expiry,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^gateway_tls_cert_expiry_seconds' | awk '{print $2}'

# MAM non-compliant device count [future — gateway_mam_noncompliant_devices not yet in handler.go]
UserParameter=gateway.mam.noncompliant,curl --config /etc/setjoin/metrics-curl.conf -s http://127.0.0.1/metrics | grep '^gateway_mam_noncompliant_devices' | awk '{print $2}'

# Identity modernization safety gauges (aggregate only; no user/source labels).
