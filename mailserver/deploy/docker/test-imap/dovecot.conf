dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

# Minimal Dovecot config for IMAP integration testing.
# No SSL, plaintext auth, static user database.

protocols = imap
listen = *

# Disable SSL for testing — test on port 143 plaintext
ssl = no
auth_allow_cleartext = yes

# Static test user — password is "testpass"
passdb static {
  password = testpass
}

userdb static {
  fields {
    uid = 5000
    gid = 5000
    home = /var/mail/%{user}
  }
}

# Deliver to Maildir (Dovecot 2.4 storage settings).
mail_driver = maildir
mail_path = /var/mail/%{user}

# IMAP specific
imap_client_workarounds = delay-newmail

# Log to stdout for Docker
log_path = /dev/stdout
info_log_path = /dev/stdout
auth_verbose = yes
mail_debug = yes
