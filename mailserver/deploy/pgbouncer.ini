; PgBouncer configuration for mailserver gateway
; Transaction pooling: connections are returned to the pool after each
; transaction completes. This allows many application connections to
; share a small number of real PostgreSQL connections.
;
; NOTE: LISTEN/NOTIFY does NOT work in transaction mode. The gateway
; maintains a separate direct PostgreSQL connection for LISTEN/NOTIFY.

[databases]
mailserver = host=127.0.0.1 port=5432 dbname=mailserver

[pgbouncer]
; Network
listen_addr = 127.0.0.1
listen_port = 5433
unix_socket_dir = /var/run/postgresql

; Pooling mode
pool_mode = transaction

; Pool sizing
; Keep small — each gateway pod needs ~20 app connections max.
; PgBouncer multiplexes these onto server_pool_size real PG connections.
default_pool_size = 25
max_client_conn = 200
reserve_pool_size = 5
reserve_pool_timeout = 3

; Auth
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; TLS to PostgreSQL backend (recommended for production)
; server_tls_sslmode = require
; server_tls_ca_file = /etc/ssl/certs/ca-certificates.crt

; Timeouts
server_connect_timeout = 5
server_idle_timeout = 600
client_idle_timeout = 0
query_timeout = 0
query_wait_timeout = 120

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; Admin interface
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

; auth_query is disabled in favour of auth_file to avoid exposing pg_shadow.
; If you need dynamic user lookup, create a SECURITY DEFINER view that returns
; only the required fields, and set auth_query to query that view.
; auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

; Preserve the app.encryption_key session GUC across transaction-mode hops.
; Without this, AfterConnect sets the key on one backend connection but
; subsequent transactions may land on a different backend where the GUC was
; never set — causing 'unrecognized configuration parameter' errors in any
; reducer that calls current_setting('app.encryption_key') (TOTP, push tokens,
; SAML IDP certs, S/MIME keys). track_extra_parameters keeps the GUC pinned
; to the logical client connection regardless of backend multiplexing.
; app.audit_hmac_key (V087, audit chain V3) rides the same mechanism: set by
; the same AfterConnect hook, read by audit_row_hash on every audit INSERT.
track_extra_parameters = app.encryption_key,app.audit_hmac_key
